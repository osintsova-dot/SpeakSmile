<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The vowel hand · песня гласных</title>
<meta name="description" content="Ладошка гласных (Jolly Phonics, Step 3): короткие a e i o u на пальцах, долгие ai ee ie oa ue под кружками, песня гласных.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#6C3FC5;--deep:#3d1b86;--ink:#2a1253;--honey:#F5C842;--yellow:#FFF560;--ease:cubic-bezier(.2,.9,.3,1.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--yellow);color:var(--ink);font-family:Fredoka,"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
.top{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 0;flex-wrap:wrap}
.back{padding:7px 14px;border-radius:999px;background:rgba(42,18,83,.1);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.back:hover{background:rgba(42,18,83,.18)}
.title{font-weight:700;font-size:clamp(17px,2.6vh,26px)}
.title small{display:block;font-weight:500;font-size:.62em;opacity:.7}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,48px);padding:8px 16px max(12px,env(safe-area-inset-bottom))}
.hand{position:relative;height:100%;max-height:100%;aspect-ratio:1000/1200;max-width:100%}
.hand img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
/* короткие гласные на пальцах — прозрачные кнопки поверх букв */
.v{position:absolute;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.v:active,.v.say{background:rgba(108,63,197,.18)}
/* кружки «?» над долгими гласными — как в Jolly */
.q{position:absolute;width:9.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--c);border:.35vh solid #111;box-shadow:0 .4vh 0 rgba(0,0,0,.25);display:grid;place-items:center;font-weight:700;font-size:min(4.4vh,6vw);color:#111;transition:transform .45s var(--ease),opacity .35s}
.q.open{transform:translate(-50%,-50%) scale(.2) rotate(-90deg);opacity:0;pointer-events:none}
.lv{position:absolute;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.lv.say{background:rgba(108,63,197,.18)}
.side{display:flex;flex-direction:column;align-items:center;gap:14px}
.disc{width:clamp(110px,22vh,200px);aspect-ratio:1;border-radius:50%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.disc img{width:100%;height:100%;border-radius:50%}
body.singing .disc img{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{padding:12px 20px;border-radius:999px;background:var(--purple);color:#fff;font-weight:600;font-size:clamp(15px,2vh,19px);box-shadow:0 5px 0 #4a2896;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--purple);box-shadow:0 5px 0 rgba(42,18,83,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a2896}
.rule{position:fixed;inset:0;z-index:5;background:rgba(42,18,83,.55);display:none;align-items:center;justify-content:center;padding:12px}
.rule.on{display:flex}
.rule .pw{position:relative;height:100%;max-height:100%;aspect-ratio:1024/1536;max-width:100%}
.rule img{width:100%;height:100%;display:block;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.rule .row{position:absolute;left:1%;right:1%;border-radius:14px}
.rule .row.say{background:rgba(108,63,197,.16)}
.rule .x{position:absolute;top:-6px;right:-6px;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--purple);font-weight:700;font-size:24px;box-shadow:0 4px 0 rgba(42,18,83,.25)}
/* песня: плакат собирается по ходу песни */
.board{display:none;flex-direction:column;gap:.6vh;height:100%;max-height:100%;aspect-ratio:1024/1560;min-width:0}
body.sung .board{display:flex}
body.sung .hint{display:none}
.board .st{width:100%;flex:none;border-radius:12px;opacity:.12;filter:grayscale(1);transform:scale(.96);transition:opacity .5s,transform .5s var(--ease),filter .5s;cursor:pointer}
.board .st.on{opacity:1;filter:none;transform:none}
.board .st.now{box-shadow:0 0 0 .5vh var(--purple),0 6px 18px rgba(42,18,83,.3)}
.lyr{position:absolute;left:50%;top:2%;transform:translate(-50%,-30%) scale(.8);opacity:0;padding:.8vh 2vh;border-radius:999px;background:#fff;color:var(--purple);font-weight:700;font-size:clamp(14px,2.6vh,26px);white-space:nowrap;box-shadow:0 4px 0 rgba(42,18,83,.15);transition:opacity .35s,transform .35s var(--ease);pointer-events:none;z-index:2}
.lyr.on{opacity:1;transform:translate(-50%,0) scale(1)}
.v.beat{background:rgba(108,63,197,.28);animation:beat .45s ease-out}
@keyframes beat{0%{transform:translate(-50%,-50%) scale(.6)}60%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1)}}
.lv.now{background:rgba(108,63,197,.22)}
.hint{max-width:240px;text-align:center;font-size:14px;opacity:.75;line-height:1.3}
@media (max-aspect-ratio:1/1){.stage{flex-direction:column}body.sung .stage{flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:center}body.sung .hand{width:43vw;height:auto}body.sung .board{height:auto;width:43vw}body.sung .side{width:100%}.hand{height:auto;width:min(100%,62vh)}.side{flex-direction:row;flex-wrap:wrap;justify-content:center}.disc{width:84px}.hint{display:none}}
</style>
</head>
<body>
<div class="top"><a class="back" href="../../gmf1/phonics/">← Phonics Hub</a><div class="title">✋ The vowel hand<small>Jolly Phonics · Step 3 · Alternatives</small></div></div>
<div class="stage">
  <div class="hand" id="hand"><img src="hand.jpg" alt="Ладошка гласных: a e i o u на пальцах, ai ee ie oa ue у оснований"><div class="lyr" id="lyr">A vowel is in every word!</div></div>
  <div class="board" id="board"><img class="st" data-g="" src="p_head.jpg" alt="When two vowels go walking, the first does the talking!"><img class="st" data-g="ai" src="p_ai.jpg" alt="ai: rain, train"><img class="st" data-g="ee" src="p_ee.jpg" alt="ee: bee, tree"><img class="st" data-g="ie" src="p_ie.jpg" alt="ie: pie, tie"><img class="st" data-g="oa" src="p_oa.jpg" alt="oa: boat, goat"><img class="st" data-g="ue" src="p_ue.jpg" alt="ue: blue, glue"><img class="st" data-g="" src="p_foot.jpg" alt="Look out for exceptions!"></div>
  <div class="side">
    <button class="disc" id="song" aria-label="Песня гласных"><img src="songs.png" alt=""></button>
    <button class="btn" id="songBtn">🎵 Песня гласных</button>
    <button class="btn ghost" id="all">👁 Открыть все</button>
    <button class="btn ghost" id="reset">↺ Закрыть</button>
    <button class="btn" id="ruleBtn" style="background:#2fb4c9;box-shadow:0 5px 0 #1f8797">📜 Правило</button>
    <p class="hint">Нажми на кружок «?» — откроется долгая гласная и прозвучит. Буквы на пальцах тоже говорят. Пробел — песня, F — во весь экран, R — правило.</p>
  </div>
</div>
<div class="rule" id="rule"><div class="pw" id="rulePw"><img src="rule.jpg" alt="When two vowels go walking, the first does the talking: rain, train, bee, tree, pie, tie, boat, goat, blue, glue"><button class="x" id="ruleX" aria-label="Закрыть">✕</button></div></div>
<script>
const SND='../../gmf1/phonics/sounds/';
// координаты в % картинки (из урока Jolly lesson_step3_unit5, кадр 1000×1200)
const SHORT=[['a',21,37.4],['e',28.7,20.2],['i',41.5,16.6],['o',53.7,18.5],['u',67.6,29.4]];
const LONG=[['ai',29.6,51.8,'#FFE94A'],['ee',35.6,38.9,'#F7A23C'],['ie',44.9,35.1,'#FFE94A'],['oa',53.1,39.6,'#B04A9E'],['ue',61.8,42.6,'#A86A33']];
const H=document.getElementById('hand');let au=null;
const say=(g,el)=>{song.pause();document.body.classList.remove('singing');au&&au.pause();au=new Audio(SND+g+'.m4a');au.play().catch(()=>{});if(el){el.classList.add('say');setTimeout(()=>el.classList.remove('say'),500);}};
SHORT.forEach(([g,x,y])=>{const b=document.createElement('button');b.className='v';b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label',g);b.onclick=()=>say(g,b);H.appendChild(b);});
LONG.forEach(([g,x,y,c])=>{const l=document.createElement('button');l.className='lv';l.style.left=x+'%';l.style.top=y+'%';l.setAttribute('aria-label',g);l.onclick=()=>say(g,l);H.appendChild(l);
  const q=document.createElement('button');q.className='q';q.textContent='?';q.style.left=x+'%';q.style.top=y+'%';q.style.setProperty('--c',c);q.setAttribute('aria-label','открыть '+g);q.onclick=()=>{q.classList.add('open');say(g);};H.appendChild(q);});
const song=new Audio('song.m4a');
// разметка песни (whisper): короткие a e i o u ×3 → «A vowel is in every word» → долгие A E I O U → правило собирается
const BEATS=[1.78,2.51,3.22,3.97,4.74,5.40,5.98,6.57,7.16,7.74,8.28,8.73,9.17,9.61,10.05];
const LONGT=[23.84,25.22,26.62,28.01,29.42], HEAD_T=30.3, FOOT_T=33.3, LYR=[13.0,22.6];
const VS=[...H.querySelectorAll('.v')], QS=[...H.querySelectorAll('.q')], LVS=[...H.querySelectorAll('.lv')], ST=[...document.querySelectorAll('.board .st')], LY=document.getElementById('lyr');
let lastBeat=-1;
const paint=()=>{const t=song.currentTime;
  const b=BEATS.findIndex((x,i)=>t>=x&&t<(BEATS[i+1]||x+.7));if(b!==lastBeat&&b>=0){const v=VS[b%5];v.classList.remove('beat');void v.offsetWidth;v.classList.add('beat');}lastBeat=b;
  LY.classList.toggle('on',t>=LYR[0]&&t<LYR[1]);
  LONGT.forEach((x,i)=>{const on=t>=x,now=on&&t<(LONGT[i+1]||x+1.6);QS[i].classList.toggle('open',on);LVS[i].classList.toggle('now',now);ST[i+1].classList.toggle('on',on);ST[i+1].classList.toggle('now',now);});
  ST[0].classList.toggle('on',t>=HEAD_T);ST[6].classList.toggle('on',t>=FOOT_T||song.ended);
  if(!song.paused)requestAnimationFrame(paint);};
const toggle=()=>{if(song.paused){au&&au.pause();R.classList.remove('on');if(song.ended||song.currentTime>=song.duration-.2)song.currentTime=0;document.body.classList.add('sung');song.play();document.body.classList.add('singing');requestAnimationFrame(paint);}else{song.pause();document.body.classList.remove('singing');}};
song.addEventListener('timeupdate',()=>{if(document.body.classList.contains('sung'))paint();});song.addEventListener('seeked',()=>{if(document.body.classList.contains('sung'))paint();});
ST.forEach(st=>st.onclick=()=>{if(st.dataset.g){say(st.dataset.g);st.classList.add('on');}});
song.onended=()=>{document.body.classList.remove('singing');ST.forEach(x=>{x.classList.add('on');x.classList.remove('now');});LVS.forEach(l=>l.classList.remove('now'));LY.classList.remove('on');};
document.getElementById('song').onclick=toggle;document.getElementById('songBtn').onclick=toggle;
document.getElementById('all').onclick=()=>document.querySelectorAll('.q').forEach(q=>q.classList.add('open'));
document.getElementById('reset').onclick=()=>{song.pause();song.currentTime=0;document.body.classList.remove('singing','sung');document.querySelectorAll('.q').forEach(q=>q.classList.remove('open'));ST.forEach(x=>x.classList.remove('on','now'));};
// правило «When two vowels go walking…»: строки плаката говорят свою долгую гласную
const R=document.getElementById('rule'),RP=document.getElementById('rulePw');
[['ai',12.7,14.4],['ee',28.1,14.9],['ie',43.8,15.2],['oa',59.9,15.3],['ue',76.2,15.3]].forEach(([g,t,h])=>{const b=document.createElement('button');b.className='row';b.style.top=t+'%';b.style.height=h+'%';b.setAttribute('aria-label',g);b.onclick=()=>say(g,b);RP.appendChild(b);});
document.getElementById('ruleBtn').onclick=()=>R.classList.add('on');
document.getElementById('ruleX').onclick=()=>R.classList.remove('on');
R.onclick=e=>{if(e.target===R)R.classList.remove('on');};
addEventListener('keydown',e=>{if(e.key==='Escape')R.classList.remove('on');if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К')R.classList.toggle('on');if(e.code==='Space'){e.preventDefault();toggle();}if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}});
</script>
</body>
</html>
