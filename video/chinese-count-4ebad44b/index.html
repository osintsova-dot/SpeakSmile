<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>数一数！ · Speak & Smile</title>
<meta property="og:title" content="数一数！ Считаем по-китайски 🏮">
<meta property="og:description" content="Китайский: считаем на пальцах до 10 и говорим, сколько лет">
<meta property="og:image" content="https://speakandsmile.ru/video/chinese-count-4ebad44b/poster.jpg">
<meta name="theme-color" content="#B3261E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+SC:wght@700&family=Onest:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --purple:#B3261E; --purple-2:#C4372B; --yellow:#F5C842; --ink:#191228; --white:#fff; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100dvh; background:var(--purple); color:var(--white);
    font-family:Onest, system-ui, sans-serif;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.13) 1.6px, transparent 2px),
      repeating-conic-gradient(from 0deg at 50% 30%, var(--purple-2) 0 10deg, var(--purple) 10deg 20deg);
    background-size: 22px 22px, auto;
    display:flex; flex-direction:column; align-items:center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  h1 {
    font-family:Bangers, 'Noto Sans SC', Impact, sans-serif; font-weight:400; letter-spacing:.02em;
    font-size:clamp(40px, 11vw, 64px); line-height:.95; color:var(--yellow); text-align:center;
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    text-shadow: 4px 5px 0 var(--ink); transform: rotate(-3deg); margin: 6px 0 18px;
    animation: pop .55s cubic-bezier(.34,1.56,.64,1) both;
  }
  .frame {
    width:min(100%, 420px); border:4px solid var(--ink); border-radius:22px; overflow:hidden;
    box-shadow: 8px 10px 0 var(--ink); background:var(--ink);
    animation: rise .5s .12s cubic-bezier(.22,1,.36,1) both;
  }
  video { display:block; width:100%; aspect-ratio:9/16; background:var(--ink); }
  p { max-width:420px; text-align:center; font-size:17px; line-height:1.45; margin-top:22px; font-weight:500; }
  .sign { color:var(--yellow); font-weight:700; margin-top:10px; font-size:15px; }
  @keyframes pop { from { opacity:0; transform: rotate(-3deg) scale(.6); } }
  @keyframes rise { from { opacity:0; transform: translateY(18px); } }
  @media (prefers-reduced-motion: reduce) { h1, .frame { animation:none; } }
</style>
</head>
<body>
  <h1>数一数！<br>Shǔ yī shǔ!</h1>
  <div class="frame">
    <video src="chinese-count.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <p>Считаем на пальцах от 一 до 十 и отвечаем на вопрос «你多大？» — «Сколько тебе лет?» 🏮</p>
  <div class="sign">Speak & Smile · Китайский</div>
</body>
</html>
