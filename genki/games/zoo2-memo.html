<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мемо · Speak &amp; Smile</title>
<style>
  :root{ --p:#6C3FC5; --p2:#8A5FD8; --honey:#F5C842; --ink:#2A2140;
    --f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--f); color:#fff; overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased;
    background:linear-gradient(160deg,#7C4DE0,#5B8DEF); }
  #app{ height:100%; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; gap:8px; padding:8px 12px; background:rgba(0,0,0,.18); flex-wrap:wrap; }
  .homebtn,.finbtn{ border:0; background:rgba(255,255,255,.22); color:#fff; font-size:14px; font-weight:800; border-radius:10px; padding:6px 11px; cursor:pointer; }
  .title{ font-weight:800; font-size:clamp(13px,2.1vh,19px); }
  .scores{ margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .sc{ display:flex; align-items:center; gap:5px; font-weight:800; font-size:clamp(13px,2vh,18px);
    padding:4px 11px; border-radius:999px; background:#fff; color:#2a2140; box-shadow:0 3px 0 rgba(0,0,0,.25); }
  .sc .dot{ width:14px;height:14px;border-radius:50%; } .sc.cur{ outline:3px solid var(--honey); }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; gap:8px; }
  .turnline{ font-weight:800; font-size:clamp(14px,2.5vh,21px); text-shadow:0 2px 4px rgba(0,0,0,.3); }
  .turnline .who{ padding:2px 12px; border-radius:999px; }
  .board{ --rows:3; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(var(--rows),minmax(0,1fr));
    gap:min(2.2vw,10px); width:min(94vw, calc(70vh*4/var(--rows))); width:min(94vw, calc(70dvh*4/var(--rows)));
    aspect-ratio:4/var(--rows); max-width:540px; }

  .card{ position:relative; min-width:0; min-height:0; border:0; background:none; padding:0; cursor:pointer; perspective:600px; }
  .inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .4s cubic-bezier(.3,.9,.4,1); }
  .card.flip .inner{ transform:rotateY(180deg); }
  .face,.back{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 5px 12px rgba(0,0,0,.28); overflow:hidden; }
  .back{ background:radial-gradient(circle at 35% 30%,#8A5FD8,#5a2ea6); color:var(--honey); font-size:clamp(24px,7vh,52px); font-weight:800;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.25), 0 5px 12px rgba(0,0,0,.28); }
  .face{ background:#fff; transform:rotateY(180deg); padding:8%; }
  .face img{ max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(0 3px 5px rgba(0,0,0,.15)); }
  .card.matched .inner{ animation:pop .5s ease; }
  .card.matched .face{ box-shadow:inset 0 0 0 3px var(--honey), 0 0 16px rgba(245,200,66,.7); }
  .card.matched{ cursor:default; }
  @keyframes pop{ 0%{transform:rotateY(180deg) scale(1)} 45%{transform:rotateY(180deg) scale(1.12)} 100%{transform:rotateY(180deg) scale(1)} }

  .ov{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(24,12,48,.6); backdrop-filter:blur(3px); padding:14px; overflow-y:auto; }
  .ov.on{ display:flex; }
  .card2{ background:#fff; color:var(--ink); border-radius:28px; padding:clamp(16px,3vh,30px) clamp(18px,4vw,40px); text-align:center; margin:auto;
    box-shadow:0 26px 70px rgba(0,0,0,.45); max-width:440px; width:100%; }
  .setup h1,.win h1{ color:var(--p); font-size:clamp(22px,4vh,30px); margin:.15em 0; }
  .speaky{ height:96px; }
  .grp{ margin:10px 0; } .grp .lab{ font-weight:800; color:var(--p); margin-bottom:6px; }
  .opts{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .opt{ min-width:52px; padding:10px 15px; border-radius:14px; border:3px solid #e6ddf5; background:#faf8fe; color:var(--p); font-weight:800; font-size:17px; cursor:pointer; }
  .opt.sel{ border-color:var(--p); background:#efe7fb; }
  .cbtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .cbtn{ border:0; cursor:pointer; font-family:var(--f); font-weight:800; font-size:clamp(15px,2.4vh,21px); padding:.5em 1.1em; border-radius:14px; color:#fff; }
  .cbtn.ok{ background:linear-gradient(180deg,#57c98b,#2ea866); box-shadow:0 5px 0 #1d7a48; }
  .cbtn.say{ background:linear-gradient(180deg,#8A5FD8,#6C3FC5); box-shadow:0 5px 0 #4c2a90; }
  #confetti{ position:fixed; inset:0; z-index:16; pointer-events:none; }
  .toast{ position:fixed; left:50%; top:12%; transform:translateX(-50%); z-index:15; background:rgba(0,0,0,.82); color:#fff; font-weight:800; padding:12px 20px; border-radius:14px; font-size:clamp(16px,2.8vh,24px); opacity:0; transition:opacity .2s; pointer-events:none; text-align:center; }
  .toast.on{ opacity:1; }
</style>

<div id="app">
  <div class="topbar">
    <button class="homebtn" id="home">☰ Темы</button>
    <div class="title" id="gtitle">🃏 Мемо</div>
    <button class="finbtn" id="restart">🔄 Заново</button>
    <div class="scores" id="scores"></div>
  </div>
  <div class="stage">
    <div class="turnline" id="turn"></div>
    <div class="board" id="board"></div>
  </div>
</div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<div class="ov setup on" id="setup"><div class="card2">
  <img class="speaky" id="spImg" alt="Speaky">
  <h1 id="setupTitle">Мемо — найди пару!</h1>
  <div style="color:#6d6584;font-weight:600;font-size:14px">Открой две карточки. Совпали — пара твоя, слушай слово 🔊 и ходи снова! Не совпали — ход переходит. Кто соберёт больше пар — победил! 🏆</div>
  <div class="grp"><div class="lab">Сколько команд?</div><div class="opts" id="teamOpts"></div></div>
  <div class="grp"><div class="lab">Сколько карточек?</div><div class="opts" id="sizeOpts"></div></div>
  <div class="cbtns"><button class="cbtn ok" id="startBtn">Играть! ▶</button></div>
  <div style="margin-top:10px"><a href="index.html" style="color:#8a83a0;font-weight:700;font-size:14px;text-decoration:none">← выбрать другую тему</a></div>
</div></div>

<div class="ov win" id="winov"><div class="card2">
  <img class="speaky" id="winSp" alt="" style="height:130px">
  <h1 id="winTxt">🏆 Победа!</h1>
  <div id="winPts" style="font-weight:800;color:#b3760a;margin-top:4px"></div>
  <div class="cbtns"><button class="cbtn ok" id="againBtn">Ещё раз 🃏</button><button class="cbtn say" onclick="location.href='index.html'">☰ Темы</button></div>
</div></div>

(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const items=ASSETS.items;
  $("#gtitle").textContent="🃏 "+ASSETS.title;
  $("#setupTitle").textContent=ASSETS.title+" — мемо";
  document.title=ASSETS.title+" — мемо";
  if(ASSETS.speaky) $("#spImg").src=ASSETS.speaky;
  const COLORS=["#FF5D5D","#4D96FF","#38C976","#B15CFF"], NAMES=["Красные","Синие","Зелёные","Фиолетовые"];

  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

  const boardEl=$("#board");
  let cards=[], flipped=[], busy=false, matched=0, total=0;
  function buildBoard(){
    const pairs=SIZE/2;
    const pool=shuffle(items).slice(0,pairs);
    const deck=shuffle(pool.concat(pool).map((it,k)=>({word:it.word,img:it.img,say:it.say})));
    cards=deck; matched=0; total=deck.length; flipped=[]; busy=false;
    boardEl.style.setProperty("--rows", Math.ceil(SIZE/4));
    boardEl.innerHTML="";
    deck.forEach((c,i)=>{ const b=document.createElement("button"); b.className="card";
      b.innerHTML='<span class="inner"><span class="back">?</span><span class="face"><img src="'+c.img+'" alt=""></span></span>';
      b.onclick=()=>flip(i,b); boardEl.appendChild(b); });
  }
  function flip(i,el){ if(busy||el.classList.contains("flip")||el.classList.contains("matched")) return;
    el.classList.add("flip"); flipped.push({i,el}); speak(cards[i].say);
    if(flipped.length===2){ busy=true; const [a,b]=flipped;
      if(cards[a.i].word===cards[b.i].word){
        setTimeout(()=>{ a.el.classList.add("matched"); b.el.classList.add("matched"); matched+=2;
          score[cur]++; renderScores(); toast("🔊 "+cards[a.i].say+"!"); speak(cards[a.i].say); burst();
          flipped=[]; busy=false;
          if(matched>=total){ setTimeout(win,900); } }, 450);
      } else {
        setTimeout(()=>{ a.el.classList.remove("flip"); b.el.classList.remove("flip"); flipped=[]; busy=false; nextTurn(); }, 950);
      }
    }
  }

  let nTeams=2, SIZE=12, score=[], cur=0;
  function renderScores(){ $("#scores").innerHTML=score.map((s,i)=>`<span class="sc ${i===cur?'cur':''}"><span class="dot" style="background:${COLORS[i]}"></span>${s}</span>`).join(""); }
  function setTurn(){ $("#turn").innerHTML = nTeams>1 ? `Ход: <span class="who" style="background:${COLORS[cur]}">${NAMES[cur]}</span>` : `Найди все пары! 🃏`; }
  function nextTurn(){ if(nTeams>1){ cur=(cur+1)%nTeams; setTurn(); renderScores(); } }
  function startGame(){ score=Array(nTeams).fill(0); cur=0; buildBoard(); setTurn(); renderScores(); }
  function win(){ burst(); const ranked=score.map((s,i)=>({i,s})).sort((a,b)=>b.s-a.s); const top=ranked[0];
    const tie=nTeams>1 && ranked.filter(r=>r.s===top.s).length>1;
    $("#winTxt").textContent = nTeams===1 ? "🎉 Все пары собраны!" : (tie?"🤝 Ничья!":`🏆 ${NAMES[top.i]} победили!`);
    $("#winPts").innerHTML = nTeams===1 ? "" : "Пары: "+ranked.map(r=>`${NAMES[r.i]} — ${r.s}`).join(" · ");
    if(ASSETS.speaky)$("#winSp").src=ASSETS.speaky; $("#winov").classList.add("on"); }

  let voice=null;
  function pv(){ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }
  pv(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=pv;
  function fixp(t){ return String(t).replace(/\bcheer\b/gi,"chear"); }
  function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(fixp(t)); u.lang="en-GB"; if(voice)u.voice=voice; u.rate=.9; u.pitch=1.05; speechSynthesis.speak(u);}catch(e){} }
  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1500); }

  $("#home").onclick=()=>{ try{speechSynthesis.cancel();}catch(e){} location.href="index.html"; };
  $("#restart").onclick=()=>startGame();
  $("#againBtn").onclick=()=>{ $("#winov").classList.remove("on"); startGame(); };
  const teamOpts=$("#teamOpts");
  [1,2,3,4].forEach(k=>{ const b=document.createElement("button"); b.className="opt"+(k===2?" sel":""); b.textContent=k; b.onclick=()=>{ nTeams=k; [...teamOpts.children].forEach(c=>c.classList.remove("sel")); b.classList.add("sel"); }; teamOpts.appendChild(b); });
  const sizeOpts=$("#sizeOpts"); const maxPairs=Math.min(8, items.length); const SIZES=[8,12,16].filter(s=>s/2<=maxPairs);
  SIZES.forEach((v,i)=>{ const b=document.createElement("button"); b.className="opt"+(v===12||(SIZES.indexOf(12)<0&&i===SIZES.length-1)?" sel":""); b.textContent=v; b.onclick=()=>{ SIZE=v; [...sizeOpts.children].forEach(c=>c.classList.remove("sel")); b.classList.add("sel"); }; sizeOpts.appendChild(b); });
  SIZE = SIZES.includes(12)?12:SIZES[SIZES.length-1];
  $("#startBtn").onclick=()=>{ $("#setup").classList.remove("on"); startGame(); speak(""); };

  const cc=$("#confetti"), cx=cc.getContext("2d"); let parts=[];
  function csize(){ cc.width=innerWidth; cc.height=innerHeight; } csize(); addEventListener("resize",csize);
  const CF=["#FF6B6B","#4D96FF","#38C976","#FFB84D","#B15CFF","#F5C842"];
  function burst(){ for(let i=0;i<110;i++) parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,g:.35,s:6+Math.random()*7,c:CF[(Math.random()*CF.length)|0],a:1,r:Math.random()*6,vr:(Math.random()-.5)*.4}); }
  (function loop(){ cx.clearRect(0,0,cc.width,cc.height); for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.a-=.008;if(p.a<=0||p.y>cc.height+20){parts.splice(i,1);continue;}cx.save();cx.globalAlpha=Math.max(p.a,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();} requestAnimationFrame(loop); })();
})();
</script>
