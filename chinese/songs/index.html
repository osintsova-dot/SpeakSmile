<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="/chinese/icons/apple-touch-icon.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="/chinese/icons/icon-192.png?v=2"><link rel="manifest" href="/chinese/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Китайский"><meta name="theme-color" content="#6C3FC5">
<title>Наши песни · Speak&Smile</title>
<meta name="description" content="Все песни курса китайского Speak&Smile подряд — слушай как плейлист.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--p:#6C3FC5;--honey:#F5C842;--pink:#F17FBE;--teal:#34D3C0;--ink:#2A2140;--muted:#6A5B9A;--soft:#F3EEFF;
  --f:"Baloo 2",ui-rounded,system-ui,sans-serif;--zh:"Noto Sans SC","PingFang SC",sans-serif;--pyf:"Nunito","Baloo 2",system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);--spring:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box}html{background:#5B3FCF}[hidden]{display:none!important}
body{margin:0;font-family:var(--f);color:#fff;min-height:100vh;padding:24px 16px 60px;text-align:center;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 90% at 15% 0%,rgba(241,127,190,.35),transparent 55%),radial-gradient(120% 90% at 100% 10%,rgba(99,179,255,.4),transparent 55%),linear-gradient(180deg,#7C4DE0,#5B3FCF 55%,#4A2FB0)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto}
.homeback{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:40;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:999px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:14px;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.homeback svg{width:18px;height:18px;fill:currentColor}
.brand{display:inline-block;margin-top:40px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);font-weight:700;font-size:13px}
.brand b{color:var(--honey)}
h1{font-family:var(--zh);font-weight:900;font-size:clamp(44px,12vw,64px);line-height:1.05;margin:10px 0 0;text-shadow:0 4px 0 rgba(74,32,150,.28),0 14px 30px rgba(0,0,0,.28)}
.lead{font-weight:700;font-size:16px;opacity:.92;margin:6px 0 20px}

/* сейчас играет */
.player{background:#fff;color:var(--ink);border-radius:28px;padding:20px 18px 18px;box-shadow:0 16px 34px rgba(30,10,70,.32)}
.cover{position:relative;height:150px;border-radius:22px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--c1,#8B5CF6),var(--c2,#6C3FC5));transition:background .5s}
.cover .z{font-family:var(--zh);font-weight:900;font-size:clamp(34px,10vw,52px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.12);padding:0 14px;line-height:1.1}
.cover .eq{position:absolute;bottom:14px;right:16px;display:flex;gap:4px;align-items:flex-end;height:22px;opacity:0;transition:opacity .3s}
.cover .eq i{width:5px;border-radius:3px;background:rgba(255,255,255,.9);height:30%}
.playing .cover .eq{opacity:1}
@media (prefers-reduced-motion:no-preference){ .playing .cover .eq i{animation:eq .9s ease-in-out infinite alternate}
  .cover .eq i:nth-child(2){animation-delay:.2s!important}.cover .eq i:nth-child(3){animation-delay:.45s!important}.cover .eq i:nth-child(4){animation-delay:.1s!important}
  .cover .z.in{animation:zin .45s var(--ease)} }
@keyframes eq{to{height:100%}}@keyframes zin{from{opacity:0;transform:translateY(10px) scale(.96)}}
.now{margin-top:14px}
.now .t{font-weight:800;font-size:20px;line-height:1.2}
.now .s{font-weight:700;color:var(--muted);font-size:14px;margin-top:2px}
.seek{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-top:14px;font:800 13px var(--pyf);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{position:relative;height:28px;cursor:pointer;touch-action:none}
.bar::before{content:"";position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:#ECE6FA}
.bar .fill{position:absolute;left:0;top:12px;height:5px;border-radius:3px;background:var(--p);width:0}
.bar .knob{position:absolute;top:7px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--p);box-shadow:0 2px 6px rgba(108,63,197,.4);left:0}
.ctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px}
.ctrl button{display:grid;place-items:center;border-radius:50%;transition:transform .16s var(--ease),background .2s}
.ctrl button:active{transform:scale(.92)}
.ctrl .sm{width:48px;height:48px;background:var(--soft);color:var(--p)}
.ctrl .sm svg{width:24px;height:24px;fill:currentColor}
.ctrl .big{width:72px;height:72px;background:var(--p);color:#fff;box-shadow:0 10px 22px rgba(108,63,197,.4)}
.ctrl .big svg{width:34px;height:34px;fill:currentColor}
.ctrl .tg{width:40px;height:40px;color:#B5ADC9}.ctrl .tg svg{width:22px;height:22px;fill:currentColor}
.ctrl .tg.on{color:var(--p);background:var(--soft)}

/* список */
.list{display:grid;gap:8px;margin-top:16px;text-align:left}
.tr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.94);color:var(--ink);text-align:left;
  box-shadow:0 8px 18px rgba(30,10,70,.2);transition:transform .16s var(--ease),background .2s;animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i)*55ms)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.tr:active{transform:scale(.98)}
.tr .no{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.tr .z{font-family:var(--zh);font-weight:900;font-size:18px;line-height:1.15}
.tr .r{font-weight:700;color:var(--muted);font-size:13px;line-height:1.2}
.tr .d{font:800 13px var(--pyf);color:var(--muted)}
.tr.on{background:#FFF6D6;box-shadow:0 0 0 3px var(--honey),0 8px 18px rgba(30,10,70,.2)}
.tr.lock{background:rgba(255,255,255,.55);box-shadow:none;cursor:default}
.tr.lock .no{background:#E6DEFB;color:var(--muted)}.tr.lock .z{color:var(--muted)}
.foot{margin-top:24px;font-size:13px;opacity:.85;font-weight:600}
.foot a{color:var(--honey)}
.tbadge{position:fixed;left:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:var(--honey);color:var(--ink);font-weight:700;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
</style></head>
<body>
<a class="homeback" href="../" aria-label="Все уроки"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg><span>Все уроки</span></a>
<div class="wrap">
  <div class="brand">Speak<b>&</b>Smile · китайский</div>
  <h1 lang="zh">我们的歌</h1>
  <p class="lead"><span style="font-family:var(--pyf)">Wǒmen de gē</span> · Наши песни — все по порядку, подряд</p>

  <div class="player" id="player">
    <div class="cover" id="cover"><div class="z" id="cZ" lang="zh">♪</div><div class="eq"><i></i><i></i><i></i><i></i></div></div>
    <div class="now"><div class="t" id="nT">Загружаю песни…</div><div class="s" id="nS"></div></div>
    <div class="seek"><span id="tCur">0:00</span><div class="bar" id="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div><span id="tDur">0:00</span></div>
    <div class="ctrl">
      <button class="tg" id="rep" aria-label="Повторять одну песню" title="Повторять одну песню"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.5v4z"/></svg></button>
      <button class="sm" id="prev" aria-label="Предыдущая"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="big" id="play" aria-label="Играть"><svg viewBox="0 0 24 24" id="icon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="sm" id="next" aria-label="Следующая"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm10-12v12h2V6z"/></svg></button>
      <span style="width:40px"></span>
    </div>
  </div>

  <div class="list" id="list"></div>
  <p class="foot">Новые песни появляются здесь после урока · <a href="../">все уроки</a></p>
</div>
<script src="../gate.js?v=4"></script>
<script>
/* плейлист: песни уроков по порядку; песня видна, когда открыт её урок (учителю — все) */
const SONGS=[
  {l:'how-are-you',     src:'../how-are-you/song.mp3',     zh:'你好，你好吗？',   ru:'Привет, как дела?',           les:'Урок 1', c:['#F17FBE','#8B5CF6']},
  {l:'how-are-you',     src:'../finale/song.mp3',          zh:'谢谢，拜拜，再见！', ru:'Песня-прощание: спасибо, пока!', les:'Каждый урок', c:['#34D3C0','#6C3FC5']},
  {l:'whats-your-name', src:'../whats-your-name/song.mp3', zh:'你叫什么名字？',   ru:'Как тебя зовут?',              les:'Урок 2', c:['#63B3FF','#6C3FC5']},
  {l:'numbers',         src:'../numbers/song.mp3',         zh:'一二三！ 数字',     ru:'Считалка до 12',               les:'Урок 5', c:['#F5C842','#F17FBE']},
  {l:'numbers',         src:'../numbers/song2.mp3?v=1',    zh:'你多大？',         ru:'Сколько тебе лет?',            les:'Урок 5', c:['#F2A65A','#8B5CF6']},
];
const $=id=>document.getElementById(id);
const a=new Audio(); a.preload='metadata';
let L=[], k=-1, rep=false;
try{ rep=localStorage.getItem('zhSongsRep')==='1'; }catch(e){}
$('rep').classList.toggle('on',rep);
const mm=s=>isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';
const ICON={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'};

function draw(g){
  L=SONGS.map(s=>({...s,open:g.isOpen(s.l)}));
  const les=id=>(g.cfg.lessons.findIndex(x=>x.id===id)+1);
  $('list').innerHTML=L.map((s,i)=>`<button class="tr${s.open?'':' lock'}" data-i="${i}" style="--i:${i};--c1:${s.c[0]};--c2:${s.c[1]}" ${s.open?'':'disabled'}>
    <span class="no">${s.open?i+1:'🔒'}</span><span><span class="z" lang="zh">${s.zh}</span><br><span class="r">${s.ru} · ${s.open?s.les:'откроется после урока '+les(s.l)}</span></span><span class="d" id="d${i}"></span></button>`).join('');
  L.forEach((s,i)=>{ if(!s.open) return; const m=new Audio(); m.preload='metadata'; m.src=s.src; m.onloadedmetadata=()=>{ $('d'+i).textContent=mm(m.duration); }; });
  const first=L.findIndex(s=>s.open); if(first>=0) load(first,false); else { $('nT').textContent='Песни откроются после первого урока'; }
  if(g.teacher && !document.querySelector('.tbadge')){ const b=document.createElement('div'); b.className='tbadge'; b.textContent='Режим учителя'; document.body.appendChild(b); }
}
function load(i,autoplay){
  k=i; const s=L[i]; a.src=s.src;
  $('cover').style.setProperty('--c1',s.c[0]); $('cover').style.setProperty('--c2',s.c[1]);
  const z=$('cZ'); z.textContent=s.zh; z.classList.remove('in'); void z.offsetWidth; z.classList.add('in');
  $('nT').textContent=s.ru; $('nS').textContent=`${s.les} · ${i+1} из ${L.filter(x=>x.open).length}`;
  document.querySelectorAll('.tr').forEach(t=>t.classList.toggle('on',+t.dataset.i===i));
  if('mediaSession' in navigator){ navigator.mediaSession.metadata=new MediaMetadata({title:`${s.zh} — ${s.ru}`,artist:'Speak&Smile · китайский',album:'Наши песни',
    artwork:[{src:'/chinese/icons/icon-512.png?v=2',sizes:'512x512',type:'image/png'},{src:'/chinese/icons/icon-192.png?v=2',sizes:'192x192',type:'image/png'}]}); }
  if(autoplay) a.play().catch(()=>{});
}
function step(d){ if(!L.length) return; let i=k; for(let n=0;n<L.length;n++){ i=(i+d+L.length)%L.length; if(L[i].open) return load(i,true); } }
$('play').onclick=()=>{ if(k<0) return; if(a.paused) a.play().catch(()=>{}); else a.pause(); };
$('next').onclick=()=>step(1); $('prev').onclick=()=>{ if(a.currentTime>3) a.currentTime=0; else step(-1); };
$('rep').onclick=()=>{ rep=!rep; $('rep').classList.toggle('on',rep); try{ localStorage.setItem('zhSongsRep',rep?'1':'0'); }catch(e){} };
$('list').addEventListener('click',e=>{ const t=e.target.closest('.tr'); if(!t||t.disabled) return; const i=+t.dataset.i; if(i===k){ $('play').click(); } else load(i,true); });
a.addEventListener('play',()=>{ $('icon').innerHTML=ICON.pause; $('player').classList.add('playing'); $('play').setAttribute('aria-label','Пауза'); });
a.addEventListener('pause',()=>{ $('icon').innerHTML=ICON.play; $('player').classList.remove('playing'); $('play').setAttribute('aria-label','Играть'); });
a.addEventListener('ended',()=>{ if(rep){ a.currentTime=0; a.play().catch(()=>{}); } else step(1); });   // после последней — снова с первой
a.addEventListener('loadedmetadata',()=>{ $('tDur').textContent=mm(a.duration); });
a.addEventListener('timeupdate',()=>{ if(drag) return; paint(a.currentTime/(a.duration||1)); $('tCur').textContent=mm(a.currentTime); });
function paint(f){ f=Math.max(0,Math.min(1,f)); $('fill').style.width=f*100+'%'; $('knob').style.left=f*100+'%'; }
let drag=false; const bar=$('bar');
const fx=e=>{ const r=bar.getBoundingClientRect(); return (e.clientX-r.left)/r.width; };
bar.addEventListener('pointerdown',e=>{ drag=true; bar.setPointerCapture(e.pointerId); paint(fx(e)); });
bar.addEventListener('pointermove',e=>{ if(drag) paint(fx(e)); });
bar.addEventListener('pointerup',e=>{ if(!drag) return; drag=false; const f=Math.max(0,Math.min(1,fx(e))); if(a.duration) a.currentTime=f*a.duration; });
if('mediaSession' in navigator){ const ms=navigator.mediaSession;
  ms.setActionHandler('play',()=>a.play()); ms.setActionHandler('pause',()=>a.pause());
  ms.setActionHandler('nexttrack',()=>step(1)); ms.setActionHandler('previoustrack',()=>step(-1)); }
document.addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); $('play').click(); } else if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1); });
ZhGate.ready.then(draw).catch(()=>{ $('nT').textContent='Не получилось загрузить. Проверь интернет и обнови страницу.'; });
</script>
</body></html>
