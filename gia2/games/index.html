<style>
:root{--p:#6C3FC5;--y:#F5C842;--bg:#0b0817;--card:rgba(255,255,255,.07);--text:#fff;--mut:#b3a8dd;

 --grad:linear-gradient(93deg,#FF2E93 0%,#FF7A2E 30%,#F5C842 55%,#2EE6FF 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100vh;padding:20px 14px}
body::before{content:"";position:fixed;width:60vw;height:60vw;left:-20vw;top:-20vw;border-radius:50%;

body::after{content:"";position:fixed;width:50vw;height:50vw;right:-15vw;bottom:-15vw;border-radius:50%;

.wrap{position:relative;max-width:860px;margin:0 auto}
h1{font-size:clamp(24px,5vw,36px);font-weight:800;margin-bottom:4px}
h1 .gr{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-weight:600;margin-bottom:18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
a.u{background:var(--card);border:1.5px solid rgba(255,255,255,.18);border-radius:16px;padding:16px 14px;
 text-decoration:none;color:#fff;font-weight:800;backdrop-filter:blur(8px)}
a.u .n{font-size:13px;color:var(--mut);font-weight:700}
a.u .t{font-size:16px;margin-top:2px}
a.u.soon{opacity:.4;pointer-events:none}
a.u.soon .t::after{content:" · soon"}
