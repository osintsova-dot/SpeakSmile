<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Связь с семьями</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/web/logo_sm.png">
<link rel="apple-touch-icon" href="/assets/web/logo_sm.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--v:#6C3FC5;--vi:#3B1F78;--h:#F5C842;--bg:#F6F4FA;--card:#fff;--ink:#1E1630;--mu:#6B6280;--line:#E6E0F0;--ok:#1F9D55;
--wa:#25D366;--mx:#5B4BFF;--tg:#229ED9;--sms:#8E8E93}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#lock{min-height:100svh;display:grid;place-items:center}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
#lock h1{font-size:22px;color:var(--vi)}
input,button{font:inherit}
input[type=password],input[type=search]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--v);color:#fff;font-weight:700;font-size:16px}
.err{color:#C0392B;font-size:14px;min-height:20px}
header{position:sticky;top:0;z-index:5;background:rgba(246,244,250,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0 10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.top h1{font-size:19px;color:var(--vi)}
.prog{font-size:14px;color:var(--mu);white-space:nowrap}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--v);border-color:var(--v);color:#fff}
.list{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.c.sent{opacity:.55}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:700;font-size:16px}
.kids{font-size:14px;color:var(--mu);margin-top:2px}
.ph{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.ph span{color:var(--mu)}
.chs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;background:#EEE9F7;color:var(--vi);text-transform:uppercase;letter-spacing:.03em}
.chip.none{background:#FFF4D1;color:#8a6a00}
.send{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.send button{border:0;border-radius:11px;padding:10px 4px;color:#fff;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.send button small{font-weight:500;font-size:10px;opacity:.85}
.send button:active{transform:scale(.97)}
.b-wa{background:var(--wa)}.b-mx{background:var(--mx)}.b-tg{background:var(--tg)}.b-sms{background:var(--sms)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.foot details{font-size:13px;color:var(--mu);flex:1;min-width:0}
.foot summary{cursor:pointer}
.foot pre{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--ink);background:#FAF8FD;border-radius:10px;padding:10px;margin-top:6px}
.mark{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--mu);white-space:nowrap}
.c.sent .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:13px;color:var(--mu);line-height:1.45;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
</style>
</head>
<body>
<div id="lock" class="wrap"><form id="lf">
  <img src="/assets/speaky.png" alt="" style="width:72px;margin:0 auto">
  <h1>Связь с семьями</h1>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" autofocus>
  <button class="btn" type="submit">Открыть</button>
  <div class="err" id="err"></div>
</form></div>

<div id="app" hidden>
<header><div class="wrap">
  <div class="top"><h1>Связь с семьями</h1><div class="prog" id="prog"></div></div>
  <div class="bar"><i id="barI"></i></div>
  <input type="search" id="q" placeholder="Поиск: фамилия, ребёнок, группа, телефон">
  <div class="tabs" id="tabs">
    <button data-f="none" class="on">Нет в ботах</button>
    <button data-f="todo">Не отправлено</button>
    <button data-f="all">Все</button>
    <button data-f="sent">Отправлено</button>
  </div>
  <p class="hint">WhatsApp и СМС откроются с готовым текстом. Для MAX и Telegram текст копируется сам: откройте чат и вставьте.</p>
</div></header>
<div class="wrap"><div class="list" id="list"></div></div>
</div>
<div class="toast" id="toast"></div>

const SITE = 'https://speakandsmile.ru/spiky/?f=';
const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let DATA = [], SENT = {}, FILTER = 'none';
try { SENT = JSON.parse(localStorage.getItem('svyaz_sent') || '{}') || {}; } catch (e) {}
const saveSent = () => { try { localStorage.setItem('svyaz_sent', JSON.stringify(SENT)); } catch (e) {} };

async function decrypt(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.s), iterations: 250000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.i) }, key, b64(ENC.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw, silent) {
  try {
    DATA = await decrypt(pw);
    try { localStorage.setItem('svyaz_pw', pw); } catch (e) {}
    $('lock').hidden = true; $('app').hidden = false; render();
  } catch (e) { if (!silent) $('err').textContent = 'Неверный пароль'; }
}
$('lf').addEventListener('submit', (e) => { e.preventDefault(); unlock($('pw').value.trim()); });
try { const p = localStorage.getItem('svyaz_pw'); if (p) unlock(p, true); } catch (e) {}

function msg(f) {
  const hi = f.a ? f.a + ', добрый день!' : 'Добрый день!';
  const kids = f.k.length > 1 ? 'детей' : 'ребёнка';
  return `${hi} Это Наталья из Speak & Smile.\n\nВидим, что чат в приложении «Твоя школа» неудобный, а общую группу не сделать: все семьи в разных мессенджерах. Поэтому теперь вы сами выбираете, где получать новости школы и монеты Спики за ${kids}: ВК, MAX или Telegram.\n\nВаша личная ссылка: ${SITE}${f.c}\nОдин клик, и всё будет приходить туда.`;
}
const fmtPh = (p) => `+7 ${p.slice(0, 3)} ${p.slice(3, 6)}-${p.slice(6, 8)}-${p.slice(8, 10)}`;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
async function copy(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); return ok; } }
function mark(code, ch) { SENT[code] = { ch, at: Date.now() }; saveSent(); render(true); }

async function go(code, ch) {
  const f = DATA.find((x) => x.c === code); if (!f) return;
  const text = msg(f), ph = '7' + f.ph;
  if (ch === 'wa') { mark(code, ch); location.href = 'https://wa.me/' + ph + '?text=' + encodeURIComponent(text); return; }
  if (ch === 'sms') { mark(code, ch); location.href = 'sms:+' + ph + '?&body=' + encodeURIComponent(text); return; }
  const ok = await copy(text);
  mark(code, ch);
  if (ch === 'tg') { toast(ok ? 'Текст скопирован. Вставьте его в чат Telegram.' : 'Не получилось скопировать: откройте «Текст» и скопируйте вручную.'); setTimeout(() => { location.href = 'https://t.me/+' + ph; }, 350); return; }
  if (ch === 'mx') { const okp = ok; toast(okp ? `Текст скопирован. В MAX найдите ${fmtPh(f.ph)} и вставьте.` : 'Не получилось скопировать: откройте «Текст» и скопируйте вручную.'); }
}

function render(keepScroll) {
  const q = $('q').value.trim().toLowerCase();
  const sentN = DATA.filter((f) => SENT[f.c]).length;
  $('prog').textContent = `Отправлено ${sentN} из ${DATA.length}`;
  $('barI').style.width = (100 * sentN / DATA.length) + '%';
  let rows = DATA.filter((f) => {
    if (FILTER === 'none' && (f.ch.length || SENT[f.c])) return false;
    if (FILTER === 'todo' && SENT[f.c]) return false;
    if (FILTER === 'sent' && !SENT[f.c]) return false;
    if (!q) return true;
    const hay = (f.p + ' ' + f.a + ' ' + f.k.map((k) => k.join(' ')).join(' ') + ' ' + f.ph + ' ' + f.alt.join(' ')).toLowerCase();
    return hay.includes(q.replace(/^\+?7|^8/, '').replace(/\D/g, '') || q) || hay.includes(q);
  });
  const L = { wa: 'WhatsApp', mx: 'MAX', tg: 'Telegram', sms: 'СМС', man: 'Отправлено' };
  $('list').innerHTML = rows.length ? rows.map((f) => {
    const s = SENT[f.c];
    const chips = f.ch.length ? f.ch.map((c) => `<span class="chip">${c === 'telegram' ? 'TG' : c === 'vk' ? 'ВК' : c.toUpperCase()}</span>`).join('') : '<span class="chip none">нет в ботах</span>';
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    return `<div class="c${s ? ' sent' : ''}">
      <div class="row"><div><div class="nm">${esc(f.p || 'Родитель')}</div>
        <div class="kids">${f.k.map((k) => esc(k[0]) + (k[1] ? ' · ' + esc(k[1]) : '')).join('<br>')}</div>
        <div class="ph">${fmtPh(f.ph)}${f.alt.length ? ' <span>· ещё ' + f.alt.map(fmtPh).join(', ') + '</span>' : ''}</div></div>
        <div class="chs">${chips}</div></div>
      <div class="send">
        <button class="b-wa" onclick="go('${f.c}','wa')">WhatsApp<small>текст готов</small></button>
        <button class="b-mx" onclick="go('${f.c}','mx')">MAX<small>скопировать</small></button>
        <button class="b-tg" onclick="go('${f.c}','tg')">Telegram<small>скопировать</small></button>
        <button class="b-sms" onclick="go('${f.c}','sms')">СМС<small>текст готов</small></button>
      </div>
      <div class="foot"><details><summary>Текст</summary><pre>${esc(msg(f))}</pre></details>
        <button class="mark" onclick="toggle('${f.c}')">${s ? '✓ ' + L[s.ch] : 'Отметить'}</button></div>
    </div>`;
  }).join('') : '<div class="empty">Здесь пусто 🎉</div>';
}
function toggle(code) { if (SENT[code]) { delete SENT[code]; saveSent(); render(); } else mark(code, 'man'); }
$('q').addEventListener('input', () => render());
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; FILTER = b.dataset.f; [...$('tabs').children].forEach((x) => x.classList.toggle('on', x === b)); render(); });
</script>
</body>
</html>
