<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Проверка заданий</title>
<style>
:root{--p:#6C3FC5;--y:#F5C842;--ink:#22183A;--mut:#6B6280;--line:#E2D8F5;--bg:#F7F4FC;--ok:#1F8A4C;--bad:#C0392B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
header{background:var(--p);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px}
header h1{margin:0;font-size:19px}
header .sub{opacity:.85;font-size:14px;margin-top:3px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.part h3{margin:0 0 2px;font-size:16px}
.q{color:var(--mut);font-size:14px;margin-bottom:8px}
audio{width:100%;margin:4px 0 8px}
.none{color:var(--mut);font-size:14px;font-style:italic;margin:6px 0}
.pts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pts button{font:inherit;font-weight:700;min-width:44px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--p);cursor:pointer;touch-action:manipulation}
.pts button.on{background:var(--p);border-color:var(--p);color:#fff}
.pts .of{color:var(--mut);font-size:14px;margin-left:4px}
textarea{width:100%;min-height:70px;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin:4px 0 10px}
.sum b{font-size:22px;color:var(--p)}
.go{width:100%;font:inherit;font-weight:700;font-size:16px;padding:14px;border:none;border-radius:12px;background:var(--p);color:#fff;cursor:pointer}
.go:disabled{opacity:.5}
.msg{margin-top:10px;font-size:14px;min-height:20px}
.msg.ok{color:var(--ok);font-weight:700}.msg.bad{color:var(--bad)}
.graded{background:#EAF7EF;border-color:#BFE5CD}
.txt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 4px;font-size:16px;line-height:1.5;white-space:normal}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🎙 Проверка Speaking и Writing</h1><div class="sub" id="who">Загружаю…</div></header>
  <div id="app"></div>
</div>
<script>
// Страница учителя: слушает записи «Урока дома» и ставит баллы (nihao-bot /speak/get, /speak/audio, /speak/grade).
var SRV=['https://d5d6o4mldv5m1nj5hvih.6brbn2wz.apigw.yandexcloud.net/nihao','https://nihao-bot.o-sintsova.workers.dev'];
var Q=new URLSearchParams(location.search), R=(Q.get('r')||'').split('.'), S=Q.get('s')||R[0]||'', K=Q.get('k')||R[1]||''; // ?r=<sid>.<ключ> — без «&»: MAX обрезал ссылку на «&»
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function call(path,opt){
  var i=0;
  return new Promise(function(res,rej){
    (function next(){
      if(i>=SRV.length) return rej(new Error('net'));
      fetch(SRV[i++]+path,Object.assign({cache:'no-store'},opt||{})).then(function(r){return r.json();}).then(function(j){ if(j&&(j.ok||j.error)) res(j); else next(); }).catch(function(){ next(); });
    })();
  });
}
var SET=null, PTS={};
function sum(){ return SET.parts.reduce(function(a,p){return a+(PTS[p.id]||0);},0); }
function paintSum(){
  var s=sum(), w=SET.written;
  $('#sum').innerHTML='<span>Speaking</span><b>'+s+' / '+SET.smax+'</b>';
  $('#tot').textContent=w!=null?('Итого: '+w+' + '+s+' = '+(w+s)+(SET.wmax?' / '+(SET.wmax+SET.smax):'')):'';
}
function render(){
  var g=SET.grade;
  $('#who').textContent=(SET.fio||SET.name)+(SET.group?' · '+SET.group:'')+' · '+SET.lesson+(SET.written!=null?' · письменная '+SET.written+(SET.wmax?' / '+SET.wmax:''):'');
  if(g) PTS=Object.assign({},g.pts);
  var h=SET.parts.map(function(p){
    var b=''; for(var n=0;n<=p.max;n++) b+='<button type="button" data-p="'+esc(p.id)+'" data-n="'+n+'"'+(PTS[p.id]===n?' class="on"':'')+'>'+n+'</button>';
    var body=p.text!=null?'<div class="txt">'+(p.text.trim()?esc(p.text).replace(/\n/g,'<br>'):'<span class="none">Текст не написан — 0 баллов.</span>')+'</div><div class="q">Слов: '+(p.text.trim()?p.text.trim().split(/\s+/).length:0)+'</div>':'<div id="au-'+esc(p.id)+'"><div class="none">Загружаю запись…</div></div>';
    return '<div class="card part"><h3>'+esc(p.label)+'</h3><div class="q">'+esc(p.q)+'</div>'+body+'<div class="pts">'+b+'<span class="of">из '+p.max+'</span></div></div>';
  }).join('');
  h+='<div class="card'+(g?' graded':'')+'"><div class="sum" id="sum"></div><div id="tot" style="color:var(--mut);margin-bottom:10px"></div>'+
     '<textarea id="cm" placeholder="Комментарий (необязательно): что получилось, над чем поработать">'+esc(g?g.comment:'')+'</textarea>'+
     '<button class="go" id="go" style="margin-top:10px">'+(g?'Сохранить исправленные баллы':'Сохранить баллы')+'</button><div class="msg" id="msg">'+(g?'Уже проверено: '+g.sum+' / '+SET.smax+'. Можно поменять и сохранить заново.':'')+'</div></div>';
  $('#app').innerHTML=h; paintSum();
  $('#app').addEventListener('click',function(e){ var b=e.target.closest('[data-n]'); if(!b) return; PTS[b.dataset.p]=+b.dataset.n; document.querySelectorAll('[data-p="'+b.dataset.p+'"]').forEach(function(x){x.classList.toggle('on',x===b);}); paintSum(); });
  $('#go').onclick=save;
  SET.parts.forEach(function(p){
    if(p.text!=null) return; // Writing — текст уже на странице
    call('/speak/audio?s='+encodeURIComponent(S)+'&k='+encodeURIComponent(K)+'&p='+encodeURIComponent(p.id)).then(function(a){
      var box=document.getElementById('au-'+p.id);
      if(!a||!a.b64){ box.innerHTML='<div class="none">Ребёнок не записал эту часть — 0 баллов.</div>'; if(PTS[p.id]==null){ PTS[p.id]=0; paintSum(); } return; }
      var bin=atob(a.b64), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      var url=URL.createObjectURL(new Blob([u],{type:a.mime||'audio/mp4'}));
      box.innerHTML='<audio controls preload="metadata" src="'+url+'"></audio>';
    }).catch(function(){ document.getElementById('au-'+p.id).innerHTML='<div class="none">Не загрузилась запись. Обновите страницу.</div>'; });
  });
}
function save(){
  var miss=SET.parts.filter(function(p){return PTS[p.id]==null;});
  if(miss.length){ $('#msg').className='msg bad'; $('#msg').textContent='Поставьте баллы за: '+miss.map(function(p){return p.label;}).join(', '); return; }
  $('#go').disabled=true; $('#msg').className='msg'; $('#msg').textContent='Сохраняю…';
  call('/speak/grade?s='+encodeURIComponent(S)+'&k='+encodeURIComponent(K),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pts:PTS,comment:$('#cm').value})}).then(function(j){
    $('#go').disabled=false;
    if(!j.ok){ $('#msg').className='msg bad'; $('#msg').textContent=j.error||'Не сохранилось'; return; }
    $('#msg').className='msg ok'; $('#msg').textContent='✓ Сохранено: Speaking '+j.sum+' / '+SET.smax+(j.total!=null?' · итого '+j.total:'')+'. Итог пришёл вам в MAX — внесите его в BigBen.';
  }).catch(function(){ $('#go').disabled=false; $('#msg').className='msg bad'; $('#msg').textContent='Нет связи. Если включён VPN — выключите и нажмите ещё раз.'; });
}
if(!S||!K){ $('#who').textContent='Нет ссылки на ответы'; }
else call('/speak/get?s='+encodeURIComponent(S)+'&k='+encodeURIComponent(K)).then(function(j){
  if(!j.ok){ $('#who').textContent=j.error||'Не нашла ответы'; return; }
  SET=j; render();
}).catch(function(){ $('#who').textContent='Нет связи с сервером. Если включён VPN — выключите и обновите страницу.'; });
</script>
</body>
</html>
