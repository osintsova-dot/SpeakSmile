<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 9 · The future is now — technology and talking about the future · Word chunks · Speak&Smile</title>
<style>
:root{--p:#6C3FC5;--pd:#4B278F;--h:#F5C842;--hd:#8A6400;--ink:#1A1A2E;--soft:#F4F4F8;--ok:#1F9D57;--bad:#D64545}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--soft);color:var(--ink);min-height:100vh}
header{background:var(--p);color:#fff;padding:14px 16px 12px}
header h1{font-size:1.05rem}header .sub{font-size:.8rem;opacity:.85;margin-top:2px}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;box-shadow:0 2px 12px rgba(108,63,197,.10)}
.tabs button{flex:0 0 auto;border:2px solid var(--p);background:#fff;color:var(--pd);font-weight:800;font-size:.85rem;
 border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff}
main{max-width:560px;margin:0 auto;padding:14px 12px 60px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(108,63,197,.10);padding:16px;margin-bottom:12px}
.big{font-size:1.15rem;font-weight:800;line-height:1.45;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opts button,.chip{border:2px solid var(--p);background:#fff;color:var(--ink);border-radius:12px;padding:12px;
 font-size:1rem;min-height:44px;cursor:pointer;text-align:left;font-weight:600}
.opts button.ok{background:#E4F5EB;border-color:var(--ok)} .opts button.bad{background:#FBEAEA;border-color:var(--bad)}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.halves button{border:2px solid var(--p);background:#fff;border-radius:12px;padding:12px 8px;font-size:.95rem;
 min-height:52px;cursor:pointer;font-weight:700;color:var(--ink)}
.halves button.sel{background:var(--h);border-color:var(--hd)}
.halves button.done{opacity:.28;pointer-events:none;background:#E4F5EB;border-color:var(--ok)}
.halves button.bad{background:#FBEAEA;border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip.used{opacity:.25;pointer-events:none}
.built{min-height:46px;border:2px dashed var(--p);border-radius:12px;padding:10px;font-weight:800;font-size:1.05rem;margin-bottom:12px;background:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:#6D6584;margin-bottom:10px}
.bar{background:var(--p);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:800;min-height:44px;cursor:pointer;width:100%}
.fin{text-align:center;padding:22px 14px}
.fin .n{font-size:2.6rem;font-weight:900;color:var(--pd)}
.setlinks{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.setlink{color:var(--pd);font-weight:700;text-decoration:none;border:2px solid var(--p);border-radius:12px;padding:9px 13px;background:#fff}
</style></head><body>
<header><h1>🧩 Unit 9 · Word chunks</h1><div class="sub">The future is now — technology and talking about the future · Speak&Smile · no translation — English only</div></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<footer style="max-width:560px;margin:0 auto;padding:0 12px 40px"><div class="setlinks"><a class="setlink" href="u10.html">Unit 10</a><a class="setlink" href="block5.html">Block 5 review</a><a class="setlink" href="index.html">All sets</a></div></footer>
<script>
"use strict";
var DATA=[{"h1": "plug it in", "h2": "overnight", "gap": "The battery is flat, so ___ ___ ___ ___.", "defn": "to connect a device to electricity and leave it there while you sleep"}, {"h1": "charge", "h2": "your phone", "gap": "Don't forget to ___ ___ ___ before the trip.", "defn": "to put electric power into a device"}, {"h1": "run out of", "h2": "fuel", "gap": "We nearly ___ ___ ___ ___ on the motorway.", "defn": "to use all of the liquid that makes an engine go, so none is left"}, {"h1": "a brilliant", "h2": "invention", "gap": "The wheel is still ___ ___ ___.", "defn": "a clever new thing that somebody thought of and made for the first time"}, {"h1": "a weak", "h2": "internet connection", "gap": "The video keeps stopping — we've got ___ ___ ___ ___.", "defn": "a poor link to the network, so information travels badly"}, {"h1": "a bright", "h2": "display", "gap": "The car shows your speed on ___ ___ ___ in front of the driver.", "defn": "the part of a machine that gives you information in light"}, {"h1": "carry out", "h2": "experiments", "gap": "Engineers ___ ___ ___ on the test track every week.", "defn": "to do scientific tests to find out whether an idea works"}, {"h1": "runs on", "h2": "solar power", "gap": "The little robot ___ ___ ___ ___ and never needs a battery.", "defn": "works using energy that comes from the sun"}, {"h1": "I'll be studying", "h2": "at university then", "gap": "In five years ___ ___ ___ ___ ___ ___.", "defn": "used to say what will be in progress at that future moment"}, {"h1": "we're meeting", "h2": "the engineer tomorrow", "gap": "___ ___ ___ ___ ___ at nine — it's in the diary.", "defn": "an arrangement already fixed for the day after today"}, {"h1": "I'm going to", "h2": "save up for it", "gap": "___ ___ ___ ___ ___ ___ ___ — maybe by the summer.", "defn": "your own plan to keep money until you have enough"}, {"h1": "isn't fast enough", "h2": "for me", "gap": "This old laptop ___ ___ ___ ___ ___.", "defn": "it doesn't work as quickly as you need it to"}];
var KEY="ss-lex-u9";
var MODES=[["halves","🧷 Halves"],["gap","✏️ In context"],["defn","🗣 Definition"],["speed","⚡ Speed build"]];
var state={mode:"halves"};
function el(t,cls,txt){var e=document.createElement(t);if(cls)e.className=cls;if(txt!==undefined)e.appendChild(document.createTextNode(txt));return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function chunkText(c){return c.h1+" "+c.h2}
function best(mode,val){try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");if(val!==undefined&&(s[mode]===undefined||val>s[mode].score||(val===s[mode]))){ }return s}catch(e){return {}}}
function saveBest(mode,score,total){try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");var old=s[mode];if(!old||score>old.score){s[mode]={score:score,total:total};localStorage.setItem(KEY,JSON.stringify(s))}}catch(e){}}
function tabs(){var t=document.getElementById("tabs");while(t.firstChild)t.removeChild(t.firstChild);
 MODES.forEach(function(m){var b=el("button",state.mode===m[0]?"on":"",m[1]);b.onclick=function(){state.mode=m[0];render()};t.appendChild(b)})}
function finish(score,total,replay){saveBest(state.mode,score,total);var main=document.getElementById("main");
 while(main.firstChild)main.removeChild(main.firstChild);
 var c=el("div","card fin");c.appendChild(el("div","n",score+" / "+total));
 c.appendChild(el("div","",score===total?"Perfect! Every chunk is yours.":"Good work — run it again and beat your score."));
 var b=el("button","bar","Play again");b.style.marginTop="14px";b.onclick=replay;c.appendChild(b);main.appendChild(c);addLinks(main)}
function addLinks(main){}
/* -------- режим 1: половинки -------- */
function rHalves(){var main=document.getElementById("main");while(main.firstChild)main.removeChild(main.firstChild);
 var picks=shuffle(DATA).slice(0,8),score=0,done=0,sel=null;
 var card=el("div","card");card.appendChild(el("div","meta","Match the halves — tap left, then right"));
 var grid=el("div","halves");
 var lefts=shuffle(picks.map(function(c){return c.h1})),rights=shuffle(picks.map(function(c){return c.h2}));
 var map={};picks.forEach(function(c){map[c.h1]=c.h2});
 function mk(txt,side){var b=el("button","",txt);b.onclick=function(){
   if(side==="L"){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
   if(!sel)return;
   if(map[sel.textContent]===txt){sel.classList.add("done");b.classList.add("done");sel.classList.remove("sel");sel=null;score++;done++;
     if(done===picks.length)setTimeout(function(){finish(score,picks.length,rHalves)},500)}
   else{b.classList.add("bad");setTimeout(function(){b.classList.remove("bad")},450);score=Math.max(0,score)}
 };return b}
 for(var i=0;i<picks.length;i++){grid.appendChild(mk(lefts[i],"L"));grid.appendChild(mk(rights[i],"R"))}
 card.appendChild(grid);main.appendChild(card);addLinks(main)}
/* -------- режимы 2–3: вопрос + 4 варианта -------- */
function rQuiz(kind){var main=document.getElementById("main");while(main.firstChild)main.removeChild(main.firstChild);
 var qs=shuffle(DATA).slice(0,8),i=0,score=0;
 function q(){while(main.firstChild)main.removeChild(main.firstChild);
  if(i>=qs.length)return finish(score,qs.length,function(){rQuiz(kind)});
  var c=qs[i],card=el("div","card");
  card.appendChild(el("div","meta",(i+1)+" / "+qs.length));
  card.appendChild(el("div","big",kind==="gap"?c.gap:c.defn+"  →  ?"));
  var opts=[chunkText(c)];shuffle(DATA).forEach(function(o){if(opts.length<4&&chunkText(o)!==chunkText(c))opts.push(chunkText(o))});
  var wrap=el("div","opts");
  shuffle(opts).forEach(function(t){var b=el("button","",t);b.onclick=function(){
    if(t===chunkText(c)){b.classList.add("ok");score++}else{b.classList.add("bad")}
    var bs=wrap.getElementsByTagName("button");for(var k=0;k<bs.length;k++)bs[k].disabled=true;
    setTimeout(function(){i++;q()},700)};wrap.appendChild(b)});
  card.appendChild(wrap);main.appendChild(card)}
 q()}
/* -------- режим 4: сборка на скорость -------- */
function rSpeed(){var main=document.getElementById("main");while(main.firstChild)main.removeChild(main.firstChild);
 var qs=shuffle(DATA).slice(0,6),i=0,t0=Date.now(),errors=0;
 function q(){while(main.firstChild)main.removeChild(main.firstChild);
  if(i>=qs.length){var sec=Math.round((Date.now()-t0)/1000);
   var main2=document.getElementById("main");var c=el("div","card fin");
   c.appendChild(el("div","n",sec+"s"));
   c.appendChild(el("div","",qs.length+" chunks built · "+errors+" wrong taps. Beat your time!"));
   var b=el("button","bar","Play again");b.style.marginTop="14px";b.onclick=rSpeed;c.appendChild(b);
   main2.appendChild(c);addLinks(main2);saveBest("speed",-sec,0);return}
  var c=qs[i],words=chunkText(c).split(" "),pos=0;
  var card=el("div","card");card.appendChild(el("div","meta",(i+1)+" / "+qs.length+" · build the chunk in order"));
  card.appendChild(el("div","big",c.defn));
  var built=el("div","built"," ");card.appendChild(built);
  var chips=el("div","chips");
  shuffle(words.map(function(w,ix){return {w:w,ix:ix}})).forEach(function(o){
   var b=el("button","chip",o.w);b.onclick=function(){
    if(words[pos]===o.w&&!b.classList.contains("used")){b.classList.add("used");
     built.textContent=(built.textContent+" "+o.w).trim();pos++;
     if(pos===words.length)setTimeout(function(){i++;q()},350)}
    else{errors++;b.classList.add("bad");setTimeout(function(){b.classList.remove("bad")},300)}};
   chips.appendChild(b)});
  card.appendChild(chips);main.appendChild(card)}
 q()}
function render(){tabs();
 if(state.mode==="halves")rHalves();
 else if(state.mode==="gap")rQuiz("gap");
 else if(state.mode==="defn")rQuiz("defn");
 else rSpeed()}
render();
</script></body></html>
