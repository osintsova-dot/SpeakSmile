<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Доска · Prepare · Speak&amp;Smile</title>
<style>
:root{--ink:#16131f;--bg:#1c1826;--panel:#262133;--line:#3a3349;--txt:#efeaf8;--mute:#a59cb8;--brand:#6C3FC5;--sun:#F5C842;--r:12px;
  --ease:cubic-bezier(.2,.8,.2,1)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.02em;color:var(--sun);white-space:nowrap}
.logo span{color:var(--txt);font-weight:600;opacity:.8}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:999px;color:var(--mute);font-weight:600;transition:background .2s var(--ease),color .2s}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tabs b{font-size:12px;color:var(--mute);margin:0 4px 0 8px;letter-spacing:.06em}
.tabs button{min-width:40px;padding:6px 8px;border-radius:8px;background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums;transition:background .15s}
.tabs button[aria-current=true]{background:var(--sun);color:var(--ink)}
.tabs button.has::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-left:4px;vertical-align:middle}
.tabs button[aria-current=true].has::after{background:var(--ink)}
.sp{flex:1}
.tool{padding:7px 12px;border-radius:8px;background:var(--panel);font-weight:600;white-space:nowrap;transition:background .15s}
.tool:hover{background:var(--line)}.tool[aria-pressed=true]{background:var(--brand)}
main{position:relative;overflow:hidden;touch-action:none}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;transform-origin:0 0;will-change:transform}
.pg{position:relative;flex:0 0 auto;box-shadow:0 10px 40px rgba(0,0,0,.45);background:#fff;border-radius:3px}
.pg img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pg .miss{position:absolute;inset:0;display:grid;place-items:center;color:#555;background:#f4f2f7;text-align:center;padding:20px;font-size:18px}
.hot{position:absolute;transform:translate(-50%,-50%);width:4.2%;min-width:30px;aspect-ratio:1;border-radius:50%;
  background:rgba(108,63,197,.18);outline:2px solid rgba(108,63,197,.75);display:grid;place-items:center;transition:transform .15s var(--ease),background .2s}
.hot:hover{transform:translate(-50%,-50%) scale(1.15);background:rgba(108,63,197,.35)}
.hot:active{transform:translate(-50%,-50%) scale(.95)}
.hot.on{background:var(--brand);outline-color:var(--sun)}
.hot.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--sun);animation:ring 1.4s var(--ease) infinite}
@keyframes ring{from{opacity:.9;transform:scale(.85)}to{opacity:0;transform:scale(1.35)}}
footer{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);border-top:1px solid var(--line);min-height:56px}
.tr{display:flex;gap:6px;flex-wrap:wrap}
.tr button{padding:8px 12px;border-radius:999px;background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums;transition:background .15s}
.tr button.on{background:var(--brand)}
.tr .none{color:var(--mute)}
.pl{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.pl .big{width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--ink);font-size:18px;font-weight:900;display:grid;place-items:center;transition:transform .12s}
.pl .big:active{transform:scale(.92)}
.pl input{flex:1;accent-color:var(--sun)}
.pl .t{font-variant-numeric:tabular-nums;color:var(--mute);min-width:88px;text-align:right}
.pl .sm{padding:6px 9px;border-radius:8px;background:var(--panel);font-weight:700}
aside{position:absolute;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);
  transition:transform .28s var(--ease);overflow:auto;padding:16px 18px;z-index:5}
aside.open{transform:none}
aside h3{margin:0 0 10px;font-size:16px;color:var(--sun)}
.k{padding:10px 0;border-top:1px solid var(--line)}
.k .q{font-weight:700;margin-bottom:4px}.k .a{color:#d9d2ea;filter:blur(6px);transition:filter .2s;cursor:pointer}
.k .a.show,aside.all .k .a{filter:none}
.k .q small{color:var(--mute);font-weight:500}
.hint{color:var(--mute);font-size:13px}
.zoomhud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:4}
.zoomhud button{width:40px;height:40px;border-radius:10px;background:rgba(38,33,51,.92);font-size:20px;font-weight:800}
.sel{position:absolute;border:3px solid var(--sun);background:rgba(245,200,66,.12);border-radius:6px;pointer-events:none;z-index:6}
main.picking{cursor:crosshair}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20}
.gate form{background:var(--panel);padding:28px;border-radius:16px;width:min(360px,90vw);display:grid;gap:12px;text-align:center}
.gate input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--txt);font-size:18px;text-align:center}
.gate button{padding:12px;border-radius:10px;background:var(--brand);font-weight:700}
.gate .err{color:#ff8a8a;min-height:1em;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><form id="gf"><div class="logo">Speak&amp;Smile <span>· доска</span></div>
<div class="hint">Для учителей школы. Введите код.</div><input id="gc" autocomplete="off" autocapitalize="off" placeholder="код"><div class="err" id="ge"></div><button>Войти</button></form></div>
<div class="app" id="app" hidden>
<header>
  <div class="logo">S&amp;S <span>доска</span></div>
  <div class="seg" id="courses" role="group" aria-label="Курс"></div>
  <div class="tabs" id="tabs"></div>
  <div class="sp"></div>
  <button class="tool" id="spread" aria-pressed="false" title="Разворот (S)">⧉ Разворот</button>
  <button class="tool" id="area" aria-pressed="false" title="Выделить задание — на весь экран (Z)">🔍 Задание</button>
  <button class="tool" id="keys" aria-pressed="false" title="Ключи (K)">🔑 Ключи</button>
  <button class="tool" id="fs" title="Во весь экран (F)">⛶</button>
</header>
<main id="main"><div class="stage" id="stage"></div>
  <div class="zoomhud"><button id="zin" title="Крупнее">+</button><button id="zout" title="Мельче">−</button><button id="z0" title="Целиком" style="font-size:14px">1:1</button></div>
  <aside id="aside"><h3>Ключи к странице</h3><div class="hint">Нажмите на ответ, чтобы показать его. <button class="tool" id="all" style="padding:4px 8px;margin-left:6px">показать все</button></div><div id="klist"></div></aside>
</main>
<footer>
  <div class="tr" id="trs"></div>
  <div class="pl"><button class="big" id="pp" aria-label="Играть">▶</button><button class="sm" id="back" title="−5 с">−5</button>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span class="t" id="tm">—</span>
    <button class="sm" id="rate" title="Скорость">1×</button></div>
</footer>
</div>
<script src="data.js?v=1"></script>
<script>
const HASH='6f29c58da8aaca3e51ba00ea78ae7fcc503dd2a727d4651c999a202b997afe4d';
const $=s=>document.querySelector(s);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gate(){ if(localStorage.ssBoard===HASH) return start();
  $('#gate').hidden=false; $('#gc').focus();
  $('#gf').onsubmit=async e=>{e.preventDefault(); const h=await sha($('#gc').value.trim().toLowerCase());
    if(h===HASH){localStorage.ssBoard=HASH;$('#gate').hidden=true;start()} else $('#ge').textContent='Код не подошёл'} }
const S={c:'p3u6',i:0,spread:false,z:1,x:0,y:0,cur:null};
const audio=new Audio(); audio.preload='metadata';
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
function U(){return BOARD[S.c]}
function visible(){const P=U().pages,p=P[S.i];
  if(!S.spread) return [S.i];
  // разворот: чётная слева (36|37, 24|25, 26|27)
  const left=p.n%2===0?S.i:S.i-1, a=P[left], b=P[left+1];
  return [left,left+1].filter(k=>P[k]&&P[k].book===p.book);}
function start(){ $('#app').hidden=false; S.spread=innerWidth>innerHeight*1.25; const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('c')&&BOARD[q.get('c')]) S.c=q.get('c'); if(q.get('p')){const k=U().pages.findIndex(x=>x.id===q.get('p')); if(k>=0) S.i=k}
  $('#courses').innerHTML=Object.keys(BOARD).map(k=>`<button data-c="${k}">${BOARD[k].course.replace('Prepare ','P')}</button>`).join('');
  $('#courses').onclick=e=>{const b=e.target.closest('button'); if(!b) return; S.c=b.dataset.c; S.i=0; stop(); render()};
  render(); }
function render(){ const u=U(), P=u.pages;
  document.querySelectorAll('#courses button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===S.c));
  const vis=visible();
  $('#tabs').innerHTML=`<b>${u.course} · U${u.unit}</b>`+['sb','wb'].map(bk=>`<b>${bk==='sb'?'SB':'WB'}</b>`+P.map((p,k)=>p.book!==bk?'':
     `<button data-k="${k}" class="${p.tracks&&p.tracks.length?'has':''}" aria-current="${vis.includes(k)}" title="${bk.toUpperCase()} стр. ${p.n}">${p.n}</button>`).join('')).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('button[data-k]'); if(b){S.i=+b.dataset.k; render()}};
  $('#spread').setAttribute('aria-pressed',S.spread);
  $('#stage').innerHTML=vis.map(k=>{const p=P[k]; if(p.missing) return `<div class="pg" style="--ar:0.71"><div class="miss">Страницы ${p.book.toUpperCase()} ${p.n} нет в нашем скане.<br>Откройте её в бумажной тетради.</div></div>`;
     return `<div class="pg" style="--ar:${p.w/p.h}"><img src="${p.img}" alt="${u.course} ${p.book.toUpperCase()} page ${p.n}">`+
       p.tracks.map(t=>`<button class="hot${S.cur===t.src?' on':''}" style="left:${t.x}%;top:${t.y}%" data-src="${t.src}" data-t="${t.t}" data-b="${p.book}" aria-label="Трек ${t.t}"></button>`).join('')+'</div>'}).join('');
  const tr=[]; vis.forEach(k=>{const p=P[k]; (p.tracks||[]).forEach(t=>{ if(!tr.find(x=>x.src===t.src)) tr.push({...t,b:p.book,n:p.n}) })});
  $('#trs').innerHTML=tr.length?tr.map(t=>`<button data-src="${t.src}" data-t="${t.t}" data-b="${t.b}" class="${S.cur===t.src?'on':''}">🔊 ${t.b.toUpperCase()} ${t.t}</button>`).join(''):'<span class="none hint">На этой странице аудио нет</span>';
  const ks=[]; vis.forEach(k=>(P[k].keys||[]).forEach(x=>ks.push([P[k].n,...x])));
  $('#klist').innerHTML=ks.length?ks.map(([n,q,a])=>`<div class="k"><div class="q">SB ${n} <small>${q||''}</small></div><div class="a">${a}</div></div>`).join(''):'<p class="hint">К этой странице ключей нет.</p>';
  location.replace('#c='+S.c+'&p='+P[S.i].id); fit(); resetZoom(); }
function fit(){const r=$('#main').getBoundingClientRect(), pg=[...document.querySelectorAll('.pg')]; if(!pg.length) return;
  const ars=pg.map(e=>+e.style.getPropertyValue('--ar')), W=r.width-20-10*(pg.length-1), Hh=r.height-20, sum=ars.reduce((a,b)=>a+b,0), h=Math.min(Hh, W/sum);
  pg.forEach((e,i)=>{e.style.height=h+'px'; e.style.width=h*ars[i]+'px'})}
function play(src,t,b){ if(S.cur===src){ audio.paused?audio.play():audio.pause(); return } S.cur=src; audio.src=src; audio.playbackRate=+($('#rate').textContent.replace('×',''))||1; audio.play(); mark(); }
function stop(){audio.pause(); S.cur=null; audio.removeAttribute('src'); mark()}
function mark(){document.querySelectorAll('[data-src]').forEach(b=>b.classList.toggle('on',b.dataset.src===S.cur)); $('#pp').textContent=audio.paused?'▶':'❚❚'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-src]'); if(b) play(b.dataset.src,b.dataset.t,b.dataset.b)});
audio.onplay=audio.onpause=audio.onended=mark;
audio.ontimeupdate=()=>{ if(!audio.duration) return; $('#seek').value=audio.currentTime/audio.duration*1000; $('#tm').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration) };
$('#seek').oninput=e=>{ if(audio.duration) audio.currentTime=e.target.value/1000*audio.duration };
$('#pp').onclick=()=>{ if(!S.cur){const f=document.querySelector('#trs [data-src]'); if(f) play(f.dataset.src); return} audio.paused?audio.play():audio.pause() };
$('#back').onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-5)};
$('#rate').onclick=e=>{const r=[1,.85,.75], i=(r.indexOf(audio.playbackRate)+1)%r.length; audio.playbackRate=r[i]; e.target.textContent=r[i]+'×'};
$('#spread').onclick=()=>{S.spread=!S.spread; render()};
$('#keys').onclick=()=>{const o=$('#aside').classList.toggle('open'); $('#keys').setAttribute('aria-pressed',o)};
$('#klist').onclick=e=>{const a=e.target.closest('.a'); if(a) a.classList.toggle('show')};
$('#all').onclick=()=>$('#aside').classList.toggle('all');
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
// листание и зум
function go(d){const P=U().pages, vis=visible(); let k=d>0?Math.max(...vis)+1:Math.min(...vis)-1; if(k<0||k>=P.length) return; S.i=k; render()}
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; const k=e.key.toLowerCase();
  if(k==='arrowright'||k==='pagedown') go(1); else if(k==='arrowleft'||k==='pageup') go(-1);
  else if(k===' '){e.preventDefault(); $('#pp').click()} else if(k==='k') $('#keys').click(); else if(k==='s') $('#spread').click(); else if(k==='f') $('#fs').click(); else if(k==='z') $('#area').click();
  else if(k==='escape'){ $('#aside').classList.remove('open'); setArea(false); resetZoom() } });
const st=$('#stage'), mn=$('#main');
function apply(){st.style.transform=`translate(${S.x}px,${S.y}px) scale(${S.z})`}
function resetZoom(){S.z=1;S.x=0;S.y=0;st.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)';apply()}
function zoomAt(f,cx,cy){const r=mn.getBoundingClientRect(); cx-=r.left; cy-=r.top; const nz=Math.min(4,Math.max(1,S.z*f));
  S.x=cx-(cx-S.x)*nz/S.z; S.y=cy-(cy-S.y)*nz/S.z; S.z=nz; if(nz===1){S.x=0;S.y=0} st.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)'; apply()}
mn.addEventListener('dblclick',e=>{ if(e.target.closest('.hot,aside,.zoomhud')) return; S.z>1?resetZoom():zoomAt(2.2,e.clientX,e.clientY)});
mn.addEventListener('wheel',e=>{ if(e.target.closest('aside')) return; e.preventDefault(); zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
$('#zin').onclick=()=>{const r=mn.getBoundingClientRect(); zoomAt(1.4,r.left+r.width/2,r.top+r.height/2)};
$('#zout').onclick=()=>{const r=mn.getBoundingClientRect(); zoomAt(1/1.4,r.left+r.width/2,r.top+r.height/2)};
$('#z0').onclick=resetZoom;
let pick=null, selEl=null;
function setArea(on){S.area=on; $('#area').setAttribute('aria-pressed',on); mn.classList.toggle('picking',on)}
$('#area').onclick=()=>{ if(S.z>1&&!S.area){resetZoom(); return} setArea(!S.area)};
function zoomRect(x0,y0,x1,y1){ // экранные координаты внутри main → на весь экран
  const r=mn.getBoundingClientRect(), w=Math.abs(x1-x0), h=Math.abs(y1-y0); if(w<20||h<20) return;
  const lx=Math.min(x0,x1)-r.left, ly=Math.min(y0,y1)-r.top;
  // в координаты сцены (с учётом текущего зума)
  const sx=(lx-S.x)/S.z, sy=(ly-S.y)/S.z, sw=w/S.z, sh=h/S.z;
  const z=Math.min(8,Math.min((r.width-24)/sw,(r.height-24)/sh));
  S.z=z; S.x=(r.width-sw*z)/2-sx*z; S.y=(r.height-sh*z)/2-sy*z;
  st.style.transition='transform .35s cubic-bezier(.2,.8,.2,1)'; apply(); }
mn.addEventListener('pointerdown',e=>{ if(!S.area||e.target.closest('.hot,aside,.zoomhud')) return; e.stopImmediatePropagation();
  pick={x:e.clientX,y:e.clientY}; selEl=document.createElement('div'); selEl.className='sel'; mn.appendChild(selEl); mn.setPointerCapture(e.pointerId)},true);
mn.addEventListener('pointermove',e=>{ if(!pick) return; e.stopImmediatePropagation(); const r=mn.getBoundingClientRect();
  Object.assign(selEl.style,{left:Math.min(pick.x,e.clientX)-r.left+'px',top:Math.min(pick.y,e.clientY)-r.top+'px',width:Math.abs(e.clientX-pick.x)+'px',height:Math.abs(e.clientY-pick.y)+'px'})},true);
mn.addEventListener('pointerup',e=>{ if(!pick) return; e.stopImmediatePropagation(); selEl.remove(); zoomRect(pick.x,pick.y,e.clientX,e.clientY); pick=null; setArea(false)},true);
let drag=null, sw=null; const pts=new Map(); let pinch=null;
mn.addEventListener('pointerdown',e=>{ if(e.target.closest('.hot,aside,.zoomhud')) return; pts.set(e.pointerId,e); mn.setPointerCapture(e.pointerId);
  if(pts.size===2){const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:S.z}; drag=null; return}
  drag={x:e.clientX,y:e.clientY,sx:S.x,sy:S.y,t:Date.now()}; st.style.transition='none'});
mn.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,e);
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()]; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); const f=pinch.z*d/pinch.d/S.z; zoomAt(f,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2); st.style.transition='none'; return}
  if(drag&&S.z>1){S.x=drag.sx+e.clientX-drag.x; S.y=drag.sy+e.clientY-drag.y; apply()} });
mn.addEventListener('pointerup',e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(drag&&S.z===1){const dx=e.clientX-drag.x; if(Math.abs(dx)>70&&Date.now()-drag.t<600) go(dx<0?1:-1)} drag=null });
addEventListener('resize',fit); document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));
gate();
</script>
</body>
</html>
