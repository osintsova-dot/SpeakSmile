<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Give Me Five! 1 · Speak&Smile</title>
<style>
:root{--p:#6C3FC5;--honey:#F5C842;--f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--f);background:radial-gradient(120% 120% at 50% 0%,#8FD0FF,#5B8DEF 45%,#7C4DE0);
 color:#fff;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{height:104px;width:auto;margin-bottom:8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px}
.sub{opacity:.9;font-weight:700;margin:0 0 26px;font-size:clamp(14px,2vw,17px)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(150px,220px));gap:20px}
@media(max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;
 background:#fff;color:#2a2140;border-radius:26px;padding:34px 18px;text-decoration:none;
 box-shadow:0 10px 26px rgba(0,0,0,.28);font-weight:800;transition:transform .12s}
.tile:active{transform:translateY(2px)}
.tile .em{font-size:56px;line-height:1}
.tile .t{font-size:22px}
.tile .d{font-size:13px;font-weight:700;color:#6a5b9a}
.tile.ph{background:linear-gradient(160deg,#fff,#fff7df);border:3px solid var(--honey)}
.foot{margin-top:28px;opacity:.85;font-size:12px}
</style></head><body>
<img class="logo" src="../assets/speaky.png" alt="Speaky">
<h1>Give Me Five! 1</h1>
<div class="sub">Игры и фониксы для класса</div>
<div class="tiles">
  <a class="tile" href="games/"><span class="em">🎲</span><span class="t">Игры</span><span class="d">на проектор · по юнитам</span></a>
  <a class="tile ph" href="phonics/?from=gmf1"><span class="em">🔤</span><span class="t">Фониксы</span><span class="d">Phonics Hub · чтение по тетради</span></a>
</div>
<div class="foot">Speak &amp; Smile · speakandsmile.ru</div>
</body></html>
