.lt,.digcue .lc,.cap,.mbtn,.balloon .body,.snd,.wl,.segreveal,.tk,.tile .big,.bt,.bflash,.card .ask,.card .ans,.page .txt{font-family:"AndikaJP",var(--f)!important;}

  :root{ --p:#6C3FC5; --p2:#8A5FD8; --honey:#F5C842; --ink:#2A2140;
    --f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--f); color:#fff; margin:0; -webkit-font-smoothing:antialiased;
    background:linear-gradient(160deg,#7C4DE0,#5B8DEF); min-height:100%; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(0,0,0,.2); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  .btn{ border:0; background:rgba(255,255,255,.22); color:#fff; font-family:var(--f); font-size:15px; font-weight:800; border-radius:11px; padding:8px 13px; cursor:pointer; }
  .htitle{ font-weight:800; font-size:clamp(15px,2.4vh,21px); }
  .wrap{ flex:1; max-width:920px; width:100%; margin:0 auto; padding:18px 16px 60px; }

  /* hub */
  h1{ font-size:clamp(24px,5vw,36px); margin:.1em 0; text-shadow:0 2px 6px rgba(0,0,0,.25); }
  .sub{ opacity:.92; font-weight:600; margin-bottom:16px; }
  h2.sec{ color:var(--honey); font-size:clamp(17px,3.4vw,22px); margin:22px 0 6px; text-shadow:0 2px 4px rgba(0,0,0,.25); }
  .subsec{ opacity:.85; font-weight:600; font-size:13px; margin-bottom:12px; }

      let c;
      if(isTask){ const aliveT=balloons.filter(b=>!b.dead && b.c===target).length;
        if(targetLeft>0 && aliveT<2) c=target; else { const others=pool.filter(x=>x!==target); c=others.length?others[Math.floor(Math.random()*others.length)]:target; } }
      else c=pool[Math.floor(Math.random()*pool.length)];
      const col=BCOL[Math.floor(Math.random()*BCOL.length)];
      const el=document.createElement("div"); el.className="balloon";
      el.innerHTML=`<div class="body" style="background:${col}">${showCase==='low'?c:cap(c)}</div><div class="str"></div>`;
      const bw=Math.min(86,Math.max(58,W*0.13)); const base=Math.random()*(W-bw-10)+5;
      el.style.left=base+"px"; el.style.top=(H+30)+"px";
      const b={el, c, base, y:H+30, vy:0.5+Math.random()*0.85, ph:Math.random()*6.28, amp:6+Math.random()*20, sw:0.015+Math.random()*0.025, dead:false};
      el.addEventListener("pointerdown",e=>{ e.preventDefault(); popB(b); });
      field.appendChild(el); balloons.push(b);
    }
    function popB(b){ if(b.dead||!bRun)return;
      if(!isTask){ b.dead=true; b.el.classList.add("pop"); popSound(); flash(b.el.querySelector('.body').textContent,true); score++; $("#bScore").textContent=score; setTimeout(()=>b.el.remove(),280); return; }
      if(b.c===target){ b.dead=true; b.el.classList.add("pop"); popSound(); flash(b.el.querySelector('.body').textContent,true);
        targetLeft--; $("#bLeft").textContent=targetLeft; setTimeout(()=>b.el.remove(),280);
        if(targetLeft===0){ rounds++; $("#bRounds").textContent=rounds; flash("🎉 Готово!",true); roundIdx++; setTimeout(()=>{ if(bRun) setTarget(); },1100); } }
      else { mistakes++; $("#bMiss").textContent=mistakes; wrongSound(); b.el.classList.add("wrongb"); setTimeout(()=>b.el.classList.remove("wrongb"),450); }
    }
    function step(){ balloons.forEach(b=>{ if(b.dead)return; b.y-=b.vy; b.ph+=b.sw;
        b.el.style.top=b.y+"px"; b.el.style.transform=`translateX(${Math.sin(b.ph)*b.amp}px)`;
        if(b.y< -130){ b.el.remove(); b.dead=true; } });
      balloons=balloons.filter(b=>!b.dead); if(bRun) bRAF=requestAnimationFrame(step); }
    $("#bStart").onclick=()=>{ if(bRun){ bRun=false; if(bTimer)clearInterval(bTimer); if(bRAF)cancelAnimationFrame(bRAF); bTimer=bRAF=null; $("#bStart").textContent="▶ Старт"; }
      else { bRun=true; $("#bStart").textContent="⏸ Пауза"; if(isTask&&!target) setTarget(); bTimer=setInterval(spawn,950); spawn(); bRAF=requestAnimationFrame(step); } };
    $("#bMode").onclick=()=>{ bMode=isTask?"free":"task"; stopBalloons(); renderBalloons(); };
    $("#bCase").onclick=()=>{ showCase=showCase==='low'?'up':'low'; const wasRun=bRun; stopBalloons(); renderBalloons(); if(wasRun) $("#bStart").click(); };
  }

  $("#back").onclick=()=>{ stopBalloons(); renderHub(); };

  // Station: ⚡ Speed reading (повтор tricky) + 📖 Чтение (слова)
  let speedTimer=null;
  function stopSpeed(){ if(speedTimer)clearInterval(speedTimer); speedTimer=null; }
  function priorTricky(){ let a=[]; for(let k=0;k<=gi;k++) a=a.concat(DATA()[k].tricky||[]); return [...new Set(a)]; }
  function renderSpeed(){ const words=priorTricky(); const p=$("#panel"); let idx=0, run=false;
    p.innerHTML=`<div class="lead">⚡ <b>Speed reading:</b> читаем tricky-слова быстро, хором. Тап по слову — послушать 🔊.</div>
      <div class="toggle" style="margin-bottom:12px"><button class="bigbtn p" id="spPlay" style="font-size:18px;padding:.4em 1.1em">▶ Старт</button><button class="btn" id="spPrev">←</button><button class="btn" id="spNext">→</button><span style="align-self:center;font-weight:800">${words.length} слов</span></div>
      <div class="segreveal" id="spWord" style="cursor:pointer;font-size:clamp(50px,15vw,120px);color:var(--honey)"></div>`;
    const show=()=>{ const el=$("#spWord"); if(el) el.textContent=words[((idx%words.length)+words.length)%words.length]; };
    show();
    $("#spWord").onclick=()=>say(words[((idx%words.length)+words.length)%words.length]);
    $("#spNext").onclick=()=>{ idx++; show(); };
    $("#spPrev").onclick=()=>{ idx--; show(); };
    $("#spPlay").onclick=()=>{ run=!run; $("#spPlay").textContent=run?"⏸ Пауза":"▶ Старт"; stopSpeed(); if(run) speedTimer=setInterval(()=>{ idx++; show(); },1300); };
  }
  function renderStory(pages){ const p=$("#panel"); let i=0;
    p.innerHTML=`<div class="lead">📖 <b>Читаем книжку!</b> Тап по странице — послушать 🔊. Стрелки — листать.</div>
      <div class="book" id="book"></div>
      <div class="toggle" style="justify-content:center;margin-top:12px"><button class="btn" id="bkPrev">◀</button><span id="bkN" style="align-self:center;font-weight:800"></span><button class="btn" id="bkNext">▶</button><button class="bigbtn p" id="bkSay" style="font-size:16px;padding:.35em 1em">🔊 Читать</button></div>`;
    const book=$("#book");
    function show(dir){ const pg=pages[i]; book.innerHTML=`<div class="page ${dir}">${pg.img?`<img class="picimg" src="${pg.img}">`:`<div class="pic">${pg.e||"📖"}</div>`}<div class="txt">${pg.t}</div></div>`; $("#bkN").textContent=(i+1)+" / "+pages.length; }
    show("nx");
    $("#bkNext").onclick=()=>{ i=(i+1)%pages.length; show("nx"); };
    $("#bkPrev").onclick=()=>{ i=(i-1+pages.length)%pages.length; show("pv"); };
    $("#bkSay").onclick=()=>say(pages[i].t);
    book.onclick=()=>say(pages[i].t);
  }
  function renderRead(){ const L=LES(); if(L.story){ renderStory(L.story); return; } const words=L.blend; const p=$("#panel"); let idx=0;
    p.innerHTML=`<div class="lead">📖 <b>Читай слова</b> вслух! Тап по слову — послушать 🔊, «Дальше» — следующее.</div>
      <div class="toggle" style="margin-bottom:12px"><button class="btn" id="rdPrev">←</button><button class="bigbtn p" id="rdNext" style="font-size:18px;padding:.4em 1.1em">Дальше →</button><span style="align-self:center;font-weight:800"><span id="rdN">1</span>/${words.length}</span></div>
      <div class="segreveal" id="rdWord" style="cursor:pointer"></div><div class="blendpic" id="rdPic"></div>`;
    const show=()=>{ const it=words[((idx%words.length)+words.length)%words.length]; $("#rdWord").textContent=it.w; $("#rdPic").textContent=it.e||""; $("#rdN").textContent=(((idx%words.length)+words.length)%words.length)+1; };
    show();
    $("#rdWord").onclick=()=>say(words[((idx%words.length)+words.length)%words.length].w);
    $("#rdNext").onclick=()=>{ idx++; show(); };
    $("#rdPrev").onclick=()=>{ idx--; show(); };
  }
  $("#home").onclick=()=>location.href="../games/index.html";
  renderHub();
})();
</script>
