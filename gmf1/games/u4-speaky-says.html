:root{--p:#6C3FC5;--pd:#4B278F;--honey:#F5C842;--good:#1FA85C;--bad:#E0556B;--f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--f);background:linear-gradient(160deg,#7C4DE0,#5B8DEF);color:#fff;min-height:100vh}

.tag{position:absolute;right:8px;top:8px;background:var(--honey);color:#5a2ea6;font-weight:800;border-radius:10px;padding:3px 10px;font-size:14px;z-index:5}

.freeze{display:none;font-size:clamp(40px,12vw,72px);margin:4px 0}
.conf{position:fixed;font-size:26px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}

<script>
document.getElementById('spy').src=SPEAKY;
var CMDS=[{"t": "Eat chicken — mmm", "e": "🍗"}, {"t": "Lick an ice cream", "e": "🍦"}, {"t": "Stir the rice", "e": "🥄"}, {"t": "Drink fruit juice", "e": "🧃"}, {"t": "Say Yuck", "e": "🤢"}, {"t": "Say Mmm", "e": "😋"}, {"t": "Crack the eggs", "e": "🍳"}, {"t": "Ring the bell", "e": "🔔"}, {"t": "Be a robot waiter", "e": "🤖"}, {"t": "Eat chips", "e": "🍟"}, {"t": "Point to the mango", "o": "mango"}, {"t": "Point to the cake", "o": "cake"}];
var PREP={ on:{b:'calc(8% + 128px)',z:3}, under:{b:'6px',z:3}, near:{b:'8%',l:'calc(50% + 78px)',z:3},
  behind:{b:'120px',z:1}, "in":{b:'55px',z:1}, wear:{b:'60px',z:3}, feet:{b:'10px',z:3}, legs:{b:'48px',z:3} };
var TAGTXT={ on:'ON', under:'UNDER', near:'NEAR', behind:'BEHIND', "in":'IN', wear:'ON', feet:'ON', legs:'ON' };
var cur=null,lastTrap=false,trapStreak=0;
function speak(t,cb){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.82;u.pitch=1.08;
 var vs=speechSynthesis.getVoices().filter(function(v){return /en[-_]?(GB|US)/i.test(v.lang)});if(vs.length)u.voice=vs[0];
 if(cb)u.onend=cb;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){if(cb)cb();}}
var card=document.getElementById('card'),verdict=document.getElementById('verdict'),
    cmdtxt=document.getElementById('cmdtxt'),scene=document.getElementById('scene'),
    act=document.getElementById('act'),frz=document.getElementById('frz'),status=document.getElementById('status'),
    bigobj=document.getElementById('bigobj'),bigimg=document.getElementById('bigimg');
function pick(){
 var c=CMDS[Math.floor(Math.random()*CMDS.length)];
 var trap=(trapStreak>=3)?true:(Math.random()<0.3);
 if(trap&&lastTrap)trap=false;
 trapStreak=trap?0:trapStreak+1;lastTrap=trap;
 cur={c:c,trap:trap,phrase:(trap?"":"Speaky says: ")+c.t+"!"};
}
function go(){
 pick();card.style.display='none';
 status.textContent="🙉 Слушаем… и делаем (или замираем!)";
 speak(cur.phrase);
}
document.getElementById('go').onclick=go;
document.getElementById('rep').onclick=function(){if(cur)speak(cur.phrase);};
document.getElementById('reveal').onclick=function(){
 if(!cur)return;
 card.style.display='block';scene.style.display='none';act.style.display='none';frz.style.display='none';bigobj.style.display='none';
 cmdtxt.textContent="«"+cur.phrase+"»";
 if(cur.trap){
  verdict.textContent="Без «Speaky says» — ЗАМРИ! Не выполняем!";
  verdict.className='verdict trap';frz.style.display='block';
  speak("No Speaky says! Freeze!");
 }else{
  verdict.textContent="Speaky says — выполняем! ✅";
  verdict.className='verdict ok';
  var c=cur.c;
  if(c.o&&c.f){showScene(c);}
  else if(c.o){bigimg.src=OBJ[c.o];bigobj.style.display='block';}
  else{act.textContent=c.e;act.style.display='block';}
  confetti();
 }
};
function showScene(c){
 scene.style.display='block';
 var holder=document.getElementById('holder'),obj=document.getElementById('obj'),tag=document.getElementById('tag');
 holder.src=(c.f==='speaky')?SPEAKY:OBJ[c.f];
 obj.src=OBJ[c.o];
 var p=PREP[c.p]||PREP.on;
 obj.style.bottom=c.b||p.b; obj.style.zIndex=p.z;
 obj.style.left=p.l||'50%';
 tag.textContent=c.tag||TAGTXT[c.p]||c.p.toUpperCase();
}
function confetti(){var em=["🎉","⭐","💜","✨","🐾"];for(var i=0;i<16;i++){var s=document.createElement('div');s.className='conf';s.textContent=em[i%em.length];s.style.left=(Math.random()*100)+"vw";s.style.animationDelay=(Math.random()*0.5)+"s";document.body.appendChild(s);setTimeout(function(n){return function(){n.remove()}}(s),2300);}}
if('speechSynthesis' in window){speechSynthesis.getVoices();}
</script></div></body></html>
