  .find{ position:absolute; transform:translate(-50%,-50%); border:0; background:transparent; cursor:pointer;
    font-size:clamp(20px,4.4vh,50px); line-height:1; padding:6px; border-radius:50%;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); transition:transform .12s; animation:idle 3.6s ease-in-out infinite; }
  .find:hover{ transform:translate(-50%,-50%) scale(1.12); }
  .find:focus-visible{ outline:4px solid #fff; outline-offset:2px; }
  .find.found{ animation:foundpop .6s ease; filter:drop-shadow(0 0 10px #FFE58A) drop-shadow(0 0 18px #FFD34D); cursor:default; }
  .find.found::after{ content:"✓"; position:absolute; top:-8px; right:-8px; background:#2ea866; color:#fff;
    width:.7em; height:.7em; border-radius:50%; font-size:.7em; display:flex; align-items:center; justify-content:center; }
  .find.wrong{ animation:wiggle .4s; }
  .bubble{ position:absolute; z-index:15; left:50%; top:25%; transform:translate(-50%,-50%) scale(.6);
    background:#fff; color:var(--ink); font-weight:800; font-size:clamp(22px,4.6vh,44px);
    padding:.4em 1em; border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,.4); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .3s cubic-bezier(.2,1.5,.4,1); text-align:center; }
  .bubble.on{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .bubble .green{ color:#2ea866; }
  .host{ position:absolute; left:2%; bottom:2%; z-index:16; display:flex; flex-direction:column; align-items:center; }
  .hostbubble{ background:#fff; color:var(--p); font-weight:800; font-size:clamp(17px,3.4vh,32px);
    padding:.35em .8em; border-radius:20px 20px 20px 6px; box-shadow:0 12px 30px rgba(0,0,0,.32);
    margin-bottom:8px; opacity:0; transform:translateY(10px) scale(.7); transform-origin:bottom left;
    transition:opacity .2s, transform .3s cubic-bezier(.2,1.5,.4,1); white-space:nowrap; }
  .hostbubble.on{ opacity:1; transform:none; }
  .speakybtn{ position:relative; border:0; background:transparent; cursor:pointer; padding:0; line-height:1;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)); transition:transform .1s; }
  .speakybtn.ask{ animation:ask 1.8s ease-in-out infinite; }
  .speakybtn:active{ transform:scale(.94); }
  .speakyimg{ height:clamp(84px,20vh,190px); width:auto; display:block; }
  .speakybtn:focus-visible{ outline:4px solid #fff; outline-offset:4px; border-radius:20px; }
  .speakybtn.jump{ animation:jump .5s ease; }
  .tap{ position:absolute; left:100%; bottom:20%; margin-left:6px; background:var(--honey); color:#5a2ea6;
    font-family:var(--f); font-weight:800; font-size:clamp(12px,2.2vh,20px); padding:.2em .6em; border-radius:999px;
    box-shadow:0 4px 10px rgba(0,0,0,.25); white-space:nowrap; animation:pulse 1.3s ease-in-out infinite; }
  .tap.hide{ display:none; }
  .findimg{ max-width:var(--sz,90px); max-height:var(--sz,90px); width:auto; height:auto; display:block; pointer-events:none; -webkit-user-drag:none; filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
  .promptimg{ height:1.35em; width:auto; vertical-align:middle; }
  .bubbleimg{ height:clamp(60px,13vh,130px); width:auto; display:block; margin:0 auto .12em; }
  .footer{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .btn{ border:0; cursor:pointer; font-family:var(--f); font-weight:800; font-size:clamp(15px,2.5vh,22px);
    padding:.5em 1.2em; border-radius:999px; transition:transform .08s; }
  .btn:active{ transform:translateY(3px); } .btn:focus-visible{ outline:4px solid #fff; outline-offset:2px; }
  .btn.hint{ color:#5a2ea6; background:linear-gradient(#FFE58A,#F5C842); box-shadow:0 6px 0 #c9950f; }
  .btn.again{ color:#fff; background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.5); }
  .win{ position:fixed; inset:0; z-index:18; display:flex; align-items:center; justify-content:center;
    background:rgba(30,16,60,.55); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .3s; }
  .win.on{ opacity:1; pointer-events:auto; }
  .win .inner{ text-align:center; } .win h2{ font-size:clamp(34px,8vh,80px); margin:0; text-shadow:0 4px 0 rgba(0,0,0,.15); }
  .win .big{ font-size:clamp(60px,14vh,140px); }
  @keyframes idle{ 0%,100%{ transform:translate(-50%,-50%);} 50%{ transform:translate(-50%,-53%);} }
  @keyframes foundpop{ 0%{ transform:translate(-50%,-50%) scale(1);} 40%{ transform:translate(-50%,-50%) scale(1.5);} 100%{ transform:translate(-50%,-50%) scale(1.15);} }
  @keyframes wiggle{ 0%,100%{ transform:translate(-50%,-50%) rotate(0);} 25%{ transform:translate(-55%,-50%) rotate(-12deg);} 75%{ transform:translate(-45%,-50%) rotate(12deg);} }
  @keyframes ask{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-10px) rotate(3deg);} }
  @keyframes jump{ 0%,100%{ transform:translateY(0);} 40%{ transform:translateY(-24px) scale(1.08);} }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
  @media (prefers-reduced-motion:reduce){ .find,.speakybtn,.tap{ animation:none; } }
</style></head><body>

  var OBJ=[{"k": "ball", "w": "ball", "q": "Where's my ball?", "x": 15, "y": 36, "s": 0.62}, {"k": "bike", "w": "bike", "q": "Where's my bike?", "x": 30, "y": 27, "s": 0.6}, {"k": "car", "w": "car", "q": "Where's my car?", "x": 47, "y": 23, "s": 0.58}, {"k": "doll", "w": "doll", "q": "Where's my doll?", "x": 64, "y": 28, "s": 0.6}, {"k": "game", "w": "computer game", "q": "Where's my computer game?", "x": 80, "y": 36, "s": 0.64}, {"k": "kite", "w": "kite", "q": "Where's my kite?", "x": 88, "y": 58, "s": 0.7}, {"k": "robot", "w": "robot", "q": "Where's my robot?", "x": 73, "y": 66, "s": 0.72}, {"k": "skateboard", "w": "skateboard", "q": "Where's my skateboard?", "x": 56, "y": 58, "s": 0.66}, {"k": "teddy_bear", "w": "teddy bear", "q": "Where's my teddy bear?", "x": 39, "y": 64, "s": 0.72}, {"k": "train", "w": "train", "q": "Where's my train?", "x": 25, "y": 57, "s": 0.6}];
  var FOUNDSAY="It's here!";
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var scene=document.getElementById("scene");
  var actx=null; function AC(){ if(!actx){ try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx;}
  function beep(f,d,t,v){ var a=AC(); if(!a)return; var o=a.createOscillator(),g=a.createGain();
    o.type=t||"triangle"; o.frequency.value=f; g.gain.value=v||0.12; o.connect(g); g.connect(a.destination);
    var n=a.currentTime; o.start(n); g.gain.exponentialRampToValueAtTime(0.0001,n+d); o.stop(n+d); }
  function good(){ [660,880,1175].forEach(function(f,i){ setTimeout(function(){beep(f,0.22,"triangle",0.14);},i*90); }); }
  function nope(){ beep(200,0.18,"sawtooth",0.09); }
  var voiceQ=null, voiceA=null;
  var FEMALE=["female","samantha","karen","moira","tessa","serena","victoria","allison","ava","susan","zoe","fiona","kate","martha","amelie","zira","hazel","google uk english female","google us english"];
  var MALE=["male","daniel","alex","fred","arthur","oliver","george","david","james","google uk english male"];
  function pickVoices(){ try{ var vs=speechSynthesis.getVoices()||[];
    var en=vs.filter(function(v){ return /^en/i.test(v.lang); }); if(!en.length) en=vs;
    function find(hints){ return en.filter(function(v){ var n=v.name.toLowerCase(); return hints.some(function(h){return n.indexOf(h)>-1;}); })[0]; }
    var female=find(FEMALE), male=find(MALE);
    voiceQ = male || en[0] || vs[0] || null;
    voiceA = female || en.filter(function(v){return v!==voiceQ;})[0] || voiceQ; }catch(e){} }
  if("speechSynthesis" in window){ pickVoices(); speechSynthesis.onvoiceschanged=pickVoices; }
  function speak(t,voice,pitch,rate){ try{ if(!("speechSynthesis" in window)) return; speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t); u.lang="en-GB"; u.pitch=pitch; u.rate=rate; if(voice)u.voice=voice;
    speechSynthesis.speak(u); }catch(e){} }
  function sayQ(t){ speak(t, voiceQ, 1.0, 0.9); }
  function sayA(t){ speak(t, voiceA, 1.1, 1.0); }
  OBJ.forEach(function(o,i){ var b=document.createElement("button");
    b.className="find"; b.style.setProperty("--sz","calc("+o.s+" * clamp(66px,14.5vh,165px))");
    var g=document.createElement("img"); g.className="findimg"; g.src=IMG[o.k]; g.alt=o.w; g.draggable=false;
    if(o.rot){ g.style.transform="rotate("+o.rot+"deg)"; } b.appendChild(g); b.style.left=o.x+"%"; b.style.top=o.y+"%";
    b.style.animationDelay=(i*0.3)+"s"; b.setAttribute("aria-label",o.w);
    b.addEventListener("click",function(){ pick(i,b); }); scene.appendChild(b); o.el=b; });
  var pQ=document.getElementById("pQ"), pEmoji=document.getElementById("pEmoji"),
      cFound=document.getElementById("cFound"), bubble=document.getElementById("bubble"),
      bEmoji=document.getElementById("bEmoji"), hostBubble=document.getElementById("hostBubble"),
      speakyBtn=document.getElementById("speakyBtn"), tapHint=document.getElementById("tapHint");
  var order=[], pos=0, found=0, asked=false, busy=false;
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.random()*(i+1)|0; var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function start(){ order=shuffle(OBJ.map(function(_,i){return i;})); pos=0; found=0; asked=false; busy=false;
    cFound.textContent="0"; OBJ.forEach(function(o){ o.el.classList.remove("found","wrong"); o.el.style.opacity=""; });
    hostBubble.classList.remove("on"); document.getElementById("win").classList.remove("on");
    inviteTap(); }
  function inviteTap(){ tapHint.classList.remove("hide"); speakyBtn.classList.add("ask"); }
  function ask(){ if(busy) return; if(pos>=order.length){ return; }
    var o=OBJ[order[pos]]; pQ.textContent=o.q; pEmoji.src=IMG[o.k];
    hostBubble.classList.add("on"); asked=true; tapHint.classList.add("hide"); speakyBtn.classList.remove("ask");
    speakyBtn.classList.remove("jump"); void speakyBtn.offsetWidth; speakyBtn.classList.add("jump");
    beep(680,0.12,"triangle",0.1); sayQ(o.q); }
  speakyBtn.addEventListener("click",function(){ AC(); if(!asked) ask(); else { sayQ(OBJ[order[pos]].q); speakyBtn.classList.remove("jump"); void speakyBtn.offsetWidth; speakyBtn.classList.add("jump"); } });
  function pick(i,b){
    if(busy) return;
    if(!asked){ speakyBtn.classList.remove("jump"); void speakyBtn.offsetWidth; speakyBtn.classList.add("jump"); beep(520,0.1,"triangle",0.08); return; }
    if(i===order[pos]){
      busy=true; asked=false; var o=OBJ[i]; b.classList.add("found"); found++; cFound.textContent=found;
      good(); confetti(b); hostBubble.classList.remove("on");
      bEmoji.src=IMG[o.k]; bubble.classList.add("on"); sayA(FOUNDSAY);
      setTimeout(function(){ bubble.classList.remove("on"); busy=false; pos++;
        if(pos>=order.length){ setTimeout(win,250); } else inviteTap(); }, 1500);
    } else { if(b.classList.contains("found")) return;
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); nope(); }
  }
  function win(){ document.getElementById("win").classList.add("on"); good(); confettiBurst(innerWidth/2,innerHeight*0.4,220); sayA("You found all my toys! Thank you!"); }
  document.getElementById("hintBtn").addEventListener("click",function(){
    if(!asked){ return; } var tgt=order[pos];
    OBJ.forEach(function(o,i){ if(i!==tgt){ o.el.style.opacity=".22"; } });
    var t=OBJ[tgt].el; t.style.transform="translate(-50%,-50%) scale(1.5)";
    setTimeout(function(){ OBJ.forEach(function(o){ o.el.style.opacity=""; }); t.style.transform=""; },900);
    beep(520,0.15,"triangle",0.1); });
  document.getElementById("againBtn").addEventListener("click",start);
  var cc=document.getElementById("confetti"), cx=cc.getContext("2d"), parts=[];
  function size(){ cc.width=innerWidth; cc.height=innerHeight; } size(); addEventListener("resize",size);
  var COL=["#FF6B6B","#4D96FF","#38C976","#FFB84D","#B15CFF","#FF7AC6","#F5C842"];
  function confettiBurst(x,y,n){ if(reduce)return; for(var i=0;i<n;i++){ parts.push({x:x,y:y,
    vx:(Math.random()-0.5)*14, vy:Math.random()*-13-3, g:0.34, s:5+Math.random()*7,
    c:COL[(Math.random()*COL.length)|0], a:1, r:Math.random()*6, vr:(Math.random()-0.5)*0.4}); } }
  function confetti(el){ var r=el.getBoundingClientRect(); confettiBurst(r.left+r.width/2,r.top+r.height/2,90); }
  (function loop(){ cx.clearRect(0,0,cc.width,cc.height);
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.a-=0.008;
      if(p.a<=0||p.y>cc.height+20){ parts.splice(i,1); continue; }
      cx.save(); cx.globalAlpha=Math.max(p.a,0); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore(); }
    requestAnimationFrame(loop); })();
  start();
})();
</script>
