<style>
:root{--p:#6C3FC5;--pd:#4B278F;--honey:#F5C842;--good:#1FA85C;--bad:#E0556B;--f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--f);background:linear-gradient(160deg,#7C4DE0,#5B8DEF);color:#fff;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 40px;text-align:center}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left}
.top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 12px;font-weight:800;font-size:14px}
.top .ttl{font-weight:800;font-size:clamp(16px,4vw,26px)}
.hint{font-size:clamp(12px,3vw,15px);opacity:.92;margin:6px 0 8px;font-weight:600}
.spy{width:clamp(90px,22vw,140px);margin:6px auto 0;filter:drop-shadow(0 5px 8px rgba(0,0,0,.3))}
button{font-family:inherit;cursor:pointer;border:none;border-radius:16px;font-weight:800;padding:12px 20px;font-size:clamp(15px,4vw,19px)}
.b1{background:var(--honey);color:#5a2ea6;box-shadow:0 5px 0 #d9ad2e}.b1:active{transform:translateY(4px);box-shadow:0 1px 0 #d9ad2e}
.b2{background:#fff;color:var(--pd);box-shadow:0 4px 0 rgba(0,0,0,.2)}.b2:active{transform:translateY(3px);box-shadow:none}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.status{min-height:34px;font-size:clamp(15px,4vw,20px);font-weight:800}
.card{background:#fff;color:#2A2140;border-radius:22px;padding:16px;margin:8px 0;box-shadow:0 8px 26px rgba(0,0,0,.28);display:none;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.verdict{font-size:clamp(18px,5vw,26px);font-weight:800}
.verdict.ok{color:var(--good)} .verdict.trap{color:var(--bad)}
.cmdtxt{font-size:clamp(15px,4vw,20px);font-weight:800;color:var(--pd);margin-top:4px}
.scene{position:relative;width:min(84vw,340px);height:240px;margin:12px auto 4px;background:linear-gradient(#EAF1FF 70%,#d9e6ff 70%);border-radius:16px;overflow:hidden;display:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:#e7d7bd}
.desk{position:absolute;left:50%;transform:translateX(-50%);bottom:24%;width:200px;height:14px;border-radius:7px;background:linear-gradient(#c9962e,#a97c1e)}
.desk::before,.desk::after{content:"";position:absolute;top:12px;width:12px;height:78px;background:#a97c1e;border-radius:4px}
.desk::before{left:14px}.desk::after{right:14px}
.shelfB{position:absolute;left:50%;transform:translateX(-50%);top:36px;width:190px;height:12px;border-radius:6px;background:linear-gradient(#c9962e,#a97c1e);box-shadow:0 4px 6px rgba(0,0,0,.15)}
.chairB{position:absolute;left:50%;transform:translateX(-58%);bottom:6%;width:110px;height:130px}
.chairB .seat{position:absolute;left:0;right:26px;top:56px;height:12px;background:#8a5fd8;border-radius:6px}
.chairB .back{position:absolute;right:26px;top:0;width:12px;height:68px;background:#8a5fd8;border-radius:6px}
.chairB .l1,.chairB .l2{position:absolute;top:66px;width:10px;height:56px;background:#6C3FC5;border-radius:4px}
.chairB .l1{left:6px}.chairB .l2{right:30px}
.binB{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;width:110px;height:120px;background:linear-gradient(#3fae5e,#2c8747);border-radius:10px 10px 16px 16px;clip-path:polygon(6% 0,94% 0,84% 100%,16% 100%)}
.binB::before{content:"";position:absolute;left:-4px;right:-4px;top:-10px;height:14px;background:#2c8747;border-radius:7px}
.holderImg{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;width:150px}
.obj{position:absolute;width:84px;transition:all .5s ease}
.tag{position:absolute;right:8px;top:8px;background:var(--honey);color:#5a2ea6;font-weight:800;border-radius:10px;padding:3px 10px;font-size:14px}
.act{font-size:clamp(60px,18vw,96px);line-height:1.2;display:none;margin:6px 0}
.freeze{display:none;font-size:clamp(40px,12vw,72px);margin:4px 0}
.conf{position:fixed;font-size:26px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(105vh) rotate(360deg);opacity:.4}}

<script>
document.getElementById('spy').src=SPEAKY;
var PUT=[ // obj key, furniture: desk/shelf/chair/bin/bagimg/pcaseimg, prep
 {o:"book",f:"shelf",p:"on",  t:"Put the book on the shelf"},
 {o:"ruler",f:"desk",p:"on",  t:"Put the ruler on the desk"},
 {o:"pencilcase",f:"desk",p:"on", t:"Put the pencil case on the desk"},
 {o:"rubber",f:"chair",p:"under", t:"Put the rubber under the chair"},
 {o:"bag",f:"desk",p:"under",     t:"Put the school bag under the desk"},
 {o:"crayon",f:"bin",p:"in",      t:"Put the crayons in the bin"},
 {o:"paperball",f:"bin",p:"in",   t:"Put the paper in the bin"},
 {o:"pencil",f:"pcase",p:"in",    t:"Put the pencil in the pencil case"},
 {o:"rubber",f:"bagimg",p:"in",   t:"Put the rubber in the school bag"},
 {o:"sharpener",f:"chair",p:"on", t:"Put the sharpener on the chair"}];
var TPR=[
 {t:"Stand up",e:"🧍⬆️"},{t:"Sit down",e:"🪑⬇️"},{t:"Clap your hands",e:"👏"},
 {t:"Touch your head",e:"🙆"},{t:"Point to the door",e:"👉🚪"},{t:"Open your book",e:"📖"},
 {t:"Wave your hand",e:"👋"},{t:"Jump",e:"🤸"},{t:"Say woof-woof like Toby",e:"🐶"}];
var cur=null,lastTrap=false,trapStreak=0;
function speak(t,cb){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.82;u.pitch=1.08;
 var vs=speechSynthesis.getVoices().filter(function(v){return /en[-_]?(GB|US)/i.test(v.lang)});if(vs.length)u.voice=vs[0];
 if(cb)u.onend=cb;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){if(cb)cb();}}
var card=document.getElementById('card'),verdict=document.getElementById('verdict'),
    cmdtxt=document.getElementById('cmdtxt'),scene=document.getElementById('scene'),
    act=document.getElementById('act'),frz=document.getElementById('frz'),status=document.getElementById('status');
function pick(){
 var isPut=Math.random()<0.6;
 var c=isPut?PUT[Math.floor(Math.random()*PUT.length)]:TPR[Math.floor(Math.random()*TPR.length)];
 var trap=(trapStreak>=3)?true:(Math.random()<0.3);
 if(trap&&lastTrap)trap=false;
 trapStreak=trap?0:trapStreak+1;lastTrap=trap;
 cur={c:c,put:isPut,trap:trap,phrase:(trap?"":"Speaky says: ")+c.t+"!"};
}
function go(){
 pick();card.style.display='none';
 status.textContent="🙉 Слушаем… и делаем (или замираем!)";
 speak(cur.phrase);
}
document.getElementById('go').onclick=go;
document.getElementById('rep').onclick=function(){if(cur)speak(cur.phrase);};
document.getElementById('reveal').onclick=function(){
 if(!cur)return;
 card.style.display='block';scene.style.display='none';act.style.display='none';frz.style.display='none';
 cmdtxt.textContent="«"+cur.phrase+"»";
 if(cur.trap){
  verdict.textContent="Без «Speaky says» — ЗАМРИ! Не выполняем!";
  verdict.className='verdict trap';frz.style.display='block';
  speak("No Speaky says! Freeze!");
 }else{
  verdict.textContent="Speaky says — выполняем! ✅";
  verdict.className='verdict ok';
  if(cur.put){showScene(cur.c);}else{act.textContent=cur.c.e;act.style.display='block';}
  confetti();
 }
};
function showScene(c){
 scene.style.display='block';
 ['fDesk','fShelf','fChair','fBin','fImg'].forEach(function(id){document.getElementById(id).style.display='none'});
 var obj=document.getElementById('obj'),tag=document.getElementById('tag'),fimg=document.getElementById('fImg');
 tag.textContent=c.p.toUpperCase();
 if(c.o==="paperball"){obj.removeAttribute('src');obj.style.display='none';}
 else{obj.src=OBJ[c.o];obj.style.display='block';}
 obj.style.left='50%';obj.style.width='84px';obj.style.zIndex=3;obj.style.transform='translateX(-50%)';
 if(c.f==="desk"){document.getElementById('fDesk').style.display='block';
   if(c.p==="on"){obj.style.bottom='calc(24% + 14px)';}else{obj.style.bottom='6%';obj.style.width='96px';}}
 if(c.f==="shelf"){document.getElementById('fShelf').style.display='block';obj.style.bottom='';obj.style.top='0px';obj.style.width='70px';obj.style.transform='translateX(-50%) translateY(-30%)';obj.style.top='36px';obj.style.marginTop='-62px';}
 if(c.f==="chair"){document.getElementById('fChair').style.display='block';
   if(c.p==="on"){obj.style.bottom='calc(6% + 132px)';obj.style.width='60px';obj.style.transform='translateX(-75%)';}
   else{obj.style.bottom='7%';obj.style.width='58px';obj.style.transform='translateX(-80%)';}}
 if(c.f==="bin"){document.getElementById('fBin').style.display='block';
   if(c.o==="paperball"){obj.style.display='none';}
   obj.style.bottom='calc(8% + 92px)';obj.style.width='62px';obj.style.zIndex=1;
   var bin=document.getElementById('fBin');bin.style.zIndex=2;}
 if(c.f==="bagimg"){fimg.style.display='block';fimg.src=OBJ["bag"];
   obj.style.bottom='calc(8% + 100px)';obj.style.width='56px';obj.style.zIndex=1;fimg.style.zIndex=2;}
 if(c.f==="pcase"){fimg.style.display='block';fimg.src=OBJ["pencilcase"];
   obj.style.bottom='calc(8% + 70px)';obj.style.width='56px';obj.style.zIndex=1;fimg.style.zIndex=2;}
 if(c.o==="paperball"&&c.f==="bin"){tag.textContent="IN · 📄";}
}
function confetti(){var em=["🎉","⭐","💜","✨","🐾"];for(var i=0;i<16;i++){var s=document.createElement('div');s.className='conf';s.textContent=em[i%em.length];s.style.left=(Math.random()*100)+"vw";s.style.animationDelay=(Math.random()*0.5)+"s";document.body.appendChild(s);setTimeout(function(n){return function(){n.remove()}}(s),2300);}}
if('speechSynthesis' in window){speechSynthesis.getVoices();}
</script></div></body></html>
