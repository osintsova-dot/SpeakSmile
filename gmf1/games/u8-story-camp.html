<style>
:root{--p:#6C3FC5;--pd:#4B278F;--honey:#F5C842;--good:#1FA85C;--bad:#E0556B;--f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--f);background:linear-gradient(160deg,#7C4DE0,#5B8DEF);color:#fff;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:12px 12px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 12px;font-weight:800;font-size:14px}
.top .ttl{font-weight:800;font-size:clamp(16px,4vw,26px)}
.hint{font-size:clamp(12px,3vw,15px);opacity:.92;margin:6px 0 10px;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:800;padding:10px 16px;font-size:15px}
.b1{background:var(--honey);color:#5a2ea6;box-shadow:0 4px 0 #d9ad2e}.b1:active{transform:translateY(3px);box-shadow:0 1px 0 #d9ad2e}
.b2{background:#fff;color:var(--pd);box-shadow:0 4px 0 rgba(0,0,0,.2)}.b2:active{transform:translateY(3px);box-shadow:none}
.slots,.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.slots,.tray{grid-template-columns:repeat(2,1fr)}}
.slot{position:relative;border:3px dashed rgba(255,255,255,.65);border-radius:14px;aspect-ratio:250/330;background:rgba(255,255,255,.10)}
.slot .num{position:absolute;top:6px;left:8px;z-index:3;background:#fff;color:var(--pd);font-weight:800;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.25);font-size:15px}
.tray{margin-top:14px;padding-top:12px;border-top:2px solid rgba(255,255,255,.35)}
.fr{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.3);transition:transform .12s;background:#fff;border:4px solid transparent}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.fr:active{transform:scale(.96)}
.fr .snd{position:absolute;right:5px;bottom:5px;background:var(--honey);border-radius:50%;width:32px;height:32px;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.slot .fr{position:absolute;inset:-3px;margin:0}
.fr.ok{border-color:var(--good)} .fr.no{border-color:var(--bad);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.done{display:none;text-align:center;font-size:clamp(20px,5vw,30px);font-weight:800;color:var(--honey);margin:14px 0;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.line{display:none;text-align:center;background:#fff;color:var(--pd);border-radius:14px;padding:10px 14px;font-weight:800;font-size:clamp(14px,3.6vw,19px);margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.conf{position:fixed;font-size:26px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(105vh) rotate(360deg);opacity:.4}}

<script>
var LINES=["We're at the camp! It's hot and sunny!", "Let's swim! — No! Look at the red flag. It's dangerous!", "Now it's raining. We can't ride the horses. What a pity!", "It's cold! Put on your jacket!", "It's sunny again! The clothes are dry. Juice time!", "Look! She's riding a horse! Hooray!", "Let's sail a boat… We can sail the MAGIC BIKE!", "We're sailing the magic bike! Camping is great!"];
var N=LINES.length;
var slots=document.getElementById('slots'),tray=document.getElementById('tray'),
    lineBox=document.getElementById('line'),doneBox=document.getElementById('done');
var placed=new Array(N).fill(null);
function speak(t,cb){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.82;u.pitch=1.05;
 var vs=speechSynthesis.getVoices().filter(function(v){return /en[-_]?(GB|US)/i.test(v.lang)});if(vs.length)u.voice=vs[0];
 if(cb)u.onend=cb;speechSynthesis.speak(u);}catch(e){if(cb)cb();}}
function say(t,cb){speechSynthesis.cancel();speak(t,cb);}
function mkFrame(i){
 var d=document.createElement('div');d.className='fr';d.dataset.i=i;
 d.innerHTML='<img src="'+FR["f"+(i+1)]+'" alt="frame"><span class="snd">🔊</span>';
 d.querySelector('.snd').addEventListener('click',function(e){e.stopPropagation();lineBox.style.display='block';lineBox.textContent=LINES[i];say(LINES[i]);});
 d.addEventListener('click',function(){move(d);});
 return d;
}
function move(d){
 var i=+d.dataset.i;
 d.classList.remove('ok','no');
 if(d.parentNode.classList.contains('slot')){
   placed[+d.parentNode.dataset.s]=null;
   tray.appendChild(d);
 }else{
   var s=placed.indexOf(null);
   if(s<0)return;
   placed[s]=i;
   document.querySelector('.slot[data-s="'+s+'"]').appendChild(d);
 }
}
function build(){
 slots.innerHTML='';tray.innerHTML='';placed=new Array(N).fill(null);doneBox.style.display='none';lineBox.style.display='none';
 for(var s=0;s<N;s++){var sl=document.createElement('div');sl.className='slot';sl.dataset.s=s;sl.innerHTML='<span class="num">'+(s+1)+'</span>';slots.appendChild(sl);}
 var order=[];for(var i=0;i<N;i++)order.push(i);
 order.sort(function(){return Math.random()-.5});
 if(order.every(function(v,i){return v===i}))order.reverse();
 order.forEach(function(i){tray.appendChild(mkFrame(i));});
