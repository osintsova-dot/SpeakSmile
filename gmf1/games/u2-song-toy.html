<style>
:root{--p:#6C3FC5;--pd:#4B278F;--honey:#F5C842;--good:#1FA85C;--bad:#E0556B;--f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--f);background:linear-gradient(160deg,#7C4DE0,#5B8DEF);color:#fff;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:12px 12px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top a{color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 12px;font-weight:800;font-size:14px}
.top .ttl{font-weight:800;font-size:clamp(16px,4vw,26px)}
.hint{font-size:clamp(12px,3vw,15px);opacity:.92;margin:6px 0 10px;font-weight:600}
.lvl{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:800;padding:10px 14px;font-size:14px}
.lb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.5)}
.lb[aria-pressed="true"]{background:#fff;color:var(--pd);border-color:#fff}
.b1{background:var(--honey);color:#5a2ea6;box-shadow:0 4px 0 #d9ad2e;font-size:16px}.b1:active{transform:translateY(3px);box-shadow:0 1px 0 #d9ad2e}
.b2{background:#fff;color:var(--pd);box-shadow:0 4px 0 rgba(0,0,0,.2)}.b2:active{transform:translateY(3px);box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
.slot{position:relative;width:clamp(86px,20vw,130px);aspect-ratio:1/1.15;border:3px dashed rgba(255,255,255,.65);border-radius:16px;background:rgba(255,255,255,.10)}
.slot .num{position:absolute;top:5px;left:7px;z-index:3;background:#fff;color:var(--pd);font-weight:800;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;padding-top:12px;border-top:2px solid rgba(255,255,255,.35)}
.cardw{width:clamp(86px,20vw,130px);aspect-ratio:1/1.15;background:#fff;border-radius:14px;border:4px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 14px rgba(0,0,0,.3);transition:transform .12s;padding:6px}
.cardw:active{transform:scale(.95)}
.cardw img{width:70%;height:62%;object-fit:contain}
.cardw .cap{font-size:clamp(10px,2.4vw,13px);font-weight:800;color:var(--pd);text-align:center}
.slot .cardw{position:absolute;inset:-3px;width:auto}
.cardw.ok{border-color:var(--good)} .cardw.no{border-color:var(--bad);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.line{display:none;text-align:center;background:#fff;color:var(--pd);border-radius:14px;padding:10px 14px;font-weight:800;font-size:clamp(14px,3.6vw,19px);margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.done{display:none;text-align:center;font-size:clamp(20px,5vw,30px);font-weight:800;color:var(--honey);margin:12px 0;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.conf{position:fixed;font-size:26px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(105vh) rotate(360deg);opacity:.4}}

<script>
var POOL=[{"k": "ball", "cap": "ball", "line": "My favourite toy is a ball"}, {"k": "teddy_bear", "cap": "teddy bear", "line": "My favourite toy is a teddy bear"}, {"k": "robot", "cap": "robot", "line": "My favourite toy is a robot"}, {"k": "kite", "cap": "kite", "line": "My favourite toy is a kite"}, {"k": "doll", "cap": "doll", "line": "My favourite toy is a doll"}, {"k": "train", "cap": "train", "line": "My favourite toy is a train"}, {"k": "car", "cap": "car", "line": "My favourite toy is a car"}, {"k": "bike", "cap": "bike", "line": "My favourite toy is a bike"}, {"k": "game", "cap": "computer game", "line": "My favourite toy is a computer game"}, {"k": "skateboard", "cap": "skateboard", "line": "My favourite toy is a skateboard"}];
var LEVELS=[{"n": 3, "song": true}, {"n": 4}, {"n": 5}];
var CHORUS="My favourite toy!";
var SUF="";
var lvl=0, seq=[], placed=[];
var slots=document.getElementById('slots'),tray=document.getElementById('tray'),
    lineBox=document.getElementById('line'),doneBox=document.getElementById('done');
function speak(t,cb){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.8;u.pitch=1.12;
 var vs=speechSynthesis.getVoices().filter(function(v){return /en[-_]?(GB|US)/i.test(v.lang)});if(vs.length)u.voice=vs[0];
 if(cb)u.onend=cb;speechSynthesis.speak(u);}catch(e){if(cb)cb();}}
function mkCard(item){
 var d=document.createElement('div');d.className='cardw';d.dataset.k=item.k;
 d.innerHTML='<img src="'+OBJ[item.k]+'" alt="">'+'<span class="cap">'+item.cap+'</span>';
 d.addEventListener('click',function(){move(d);});
 return d;
}
function move(d){
 d.classList.remove('ok','no');
 if(d.parentNode.classList.contains('slot')){placed[+d.parentNode.dataset.s]=null;tray.appendChild(d);}
 else{var s=placed.indexOf(null);if(s<0)return;placed[s]=d.dataset.k;
   document.querySelector('.slot[data-s="'+s+'"]').appendChild(d);autoCheck();}
}
function build(){
 doneBox.style.display='none';lineBox.style.display='none';
 var L=LEVELS[lvl];
 if(L.song){seq=POOL.slice(0,L.n);}
 else{var p=POOL.slice().sort(function(){return Math.random()-.5});seq=p.slice(0,L.n);}
 placed=new Array(seq.length).fill(null);
 slots.innerHTML='';tray.innerHTML='';
 for(var s=0;s<seq.length;s++){var sl=document.createElement('div');sl.className='slot';sl.dataset.s=s;sl.innerHTML='<span class="num">'+(s+1)+'</span>';slots.appendChild(sl);}
 var shuffled=seq.slice().sort(function(){return Math.random()-.5});
 if(shuffled.every(function(v,i){return v===seq[i]}))shuffled.reverse();
 shuffled.forEach(function(it){tray.appendChild(mkCard(it));});
}
function playAll(){
 speechSynthesis.cancel();lineBox.style.display='block';
 var k=0;
 (function next(){
  if(k>=seq.length){lineBox.textContent="🎵 "+CHORUS;speak(CHORUS);return;}
  lineBox.textContent="🎵 …";
  speak(seq[k].line+SUF,function(){k++;setTimeout(next,500);});
 })();
}
function autoCheck(){ if(placed.indexOf(null)<0){checkNow();} }
function checkNow(){
 var good=true;
 for(var s=0;s<seq.length;s++){
  var c=document.querySelector('.slot[data-s="'+s+'"] .cardw');
  if(!c){good=false;continue;}
  if(c.dataset.k===seq[s].k){c.classList.add('ok');c.classList.remove('no');}
  else{c.classList.add('no');c.classList.remove('ok');good=false;
   (function(cd){setTimeout(function(){move(cd);},650);})(c);}
 }
 if(good&&placed.indexOf(null)<0){doneBox.style.display='block';confetti();
  speechSynthesis.cancel();speak(CHORUS+" Well done!");}
}
document.getElementById('play').onclick=playAll;
document.getElementById('check').onclick=checkNow;
document.getElementById('reset').onclick=build;
document.querySelectorAll('.lb').forEach(function(b){b.onclick=function(){
 document.querySelectorAll('.lb').forEach(function(x){x.setAttribute('aria-pressed','false')});
 b.setAttribute('aria-pressed','true');lvl=+b.dataset.l;build();};});
function confetti(){var em=["🎉","⭐","💜","✨","🎵"];for(var i=0;i<20;i++){var s=document.createElement('div');s.className='conf';s.textContent=em[i%em.length];s.style.left=(Math.random()*100)+"vw";s.style.animationDelay=(Math.random()*0.5)+"s";document.body.appendChild(s);setTimeout(function(n){return function(){n.remove()}}(s),2300);}}
if('speechSynthesis' in window){speechSynthesis.getVoices();}
build();
</script></div></body></html>
