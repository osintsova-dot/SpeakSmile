<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What's this? · Спиннер города · GMF1 U7</title>
<style>
  :root{ --p:#6C3FC5; --honey:#F5C842; --ink:#2A2140;
    --f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--f); color:#fff; overflow:hidden;
    background:linear-gradient(135deg,#7C4DE0 0%,#5B8DEF 50%,#3FB8D4 100%); -webkit-font-smoothing:antialiased; }
  #bg,#confetti{ position:fixed; inset:0; width:100%; height:100%; }
  #bg{ z-index:0; } #confetti{ z-index:6; pointer-events:none; }
  .stage{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:clamp(8px,2vh,22px); padding:2vh 2vw; }
  .head{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .title{ font-size:clamp(30px,6.6vh,70px); font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.14),0 10px 24px rgba(0,0,0,.25); }
  .title .q{ color:var(--honey); }
  .sub{ font-size:clamp(13px,2vh,20px); opacity:.92; font-weight:600; }
  .wheelwrap{ position:relative; width:min(72vh,92vw); height:min(72vh,92vw); }
  .pointer{ position:absolute; top:-2%; left:50%; transform:translateX(-50%); z-index:4;
    font-size:clamp(30px,6vh,54px); filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  #wheel{ width:100%; height:100%; border-radius:50%; background:#fff;
    box-shadow:0 0 0 clamp(8px,1.4vh,16px) #fff,0 0 0 clamp(12px,2vh,22px) rgba(0,0,0,.12),0 24px 60px rgba(0,0,0,.35); }
  .hub{ position:absolute; top:50%; left:50%; width:15%; height:15%; transform:translate(-50%,-50%); z-index:3;
    border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#ffe08a 60%,#f5c842);
    box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 0 0 4px #fff; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .hub img{ width:78%; height:78%; object-fit:contain; }
  .spin{ border:0; cursor:pointer; font-family:var(--f); font-weight:800; font-size:clamp(20px,3.4vh,32px);
    color:#5a2ea6; padding:.6em 1.6em; border-radius:999px; background:linear-gradient(180deg,#FFE58A,#F5C842);
    box-shadow:0 8px 0 #c9950f,0 14px 26px rgba(0,0,0,.3); transition:transform .08s,box-shadow .08s; }
  .spin:hover{ transform:translateY(-1px); } .spin:active{ transform:translateY(6px); box-shadow:0 2px 0 #c9950f,0 6px 14px rgba(0,0,0,.3); }
  .spin:focus-visible{ outline:4px solid #fff; outline-offset:3px; }
  .spin[disabled]{ filter:grayscale(.3) opacity(.7); cursor:default; }
  .spin .p{ animation:pulse 1.6s ease-in-out infinite; display:inline-block; }
  .card{ position:fixed; inset:0; z-index:7; display:flex; align-items:center; justify-content:center;
    background:rgba(30,16,60,.5); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s; }
  .card.on{ opacity:1; pointer-events:auto; }
  .card .inner{ background:#fff; color:var(--ink); border-radius:32px; padding:clamp(18px,3.5vh,40px) clamp(24px,5vw,60px);
    text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.45); transform:scale(.7); transition:transform .3s cubic-bezier(.2,1.4,.4,1); max-width:92vw; }
  .card.on .inner{ transform:scale(1); }
  .card .pic{ height:clamp(120px,26vh,240px); width:auto; filter:drop-shadow(0 10px 14px rgba(0,0,0,.18)); animation:pop .5s cubic-bezier(.2,1.5,.4,1) both; }
  .card .ask{ font-size:clamp(28px,5.4vh,56px); font-weight:800; color:var(--p); margin:.15em 0 .1em; }
  .card .ans{ font-size:clamp(24px,4.6vh,46px); font-weight:800; color:#b3760a; background:#fff7dd;
    padding:.12em .6em; border-radius:16px; display:inline-block; opacity:0; transform:translateY(8px); transition:opacity .25s,transform .25s; }
  .card .ans.show{ opacity:1; transform:none; }
  .card .ans b{ color:#d1720a; }
  .cbtns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:clamp(12px,2.4vh,24px); }
  .cbtn{ border:0; cursor:pointer; font-family:var(--f); font-weight:800; font-size:clamp(16px,2.6vh,24px); padding:.55em 1.3em; border-radius:999px; transition:transform .08s; }
  .cbtn:active{ transform:translateY(3px); } .cbtn:focus-visible{ outline:4px solid var(--p); outline-offset:2px; }
  .cbtn.rev{ color:#fff; background:linear-gradient(180deg,#8A5FD8,#6C3FC5); box-shadow:0 6px 0 #4c2a90; }
  .cbtn.again{ color:#5a2ea6; background:#efe7fb; box-shadow:0 6px 0 #c8b6ec; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
  @keyframes pop{ 0%{ transform:scale(.3);} 100%{ transform:scale(1);} }
  @media (prefers-reduced-motion:reduce){ .spin .p{ animation:none; } }
</style></head><body>
<canvas id="bg"></canvas>
<canvas id="confetti"></canvas>
<div class="stage">
  <div class="head">

  </div>
  <div class="wheelwrap">
    <div class="pointer">🔻</div>
    <canvas id="wheel" width="920" height="920" aria-label="Spinner"></canvas>
    <div class="hub"><img id="hubImg" alt="Speaky"></div>
  </div>
  <button class="spin" id="spinBtn"><span class="p">SPIN! 🎡</span></button>
</div>
<div class="card" id="card" aria-live="polite">
  <div class="inner">
    <img class="pic" id="cPic" alt="">
    <div class="ask" id="cAsk">What's this?</div>
    <div class="ans" id="cAns"></div>
    <div class="cbtns">
      <button class="cbtn rev" id="revBtn">Ответ ✨</button>
      <button class="cbtn again" id="againBtn">Spin again 🎡</button>
    </div>
  </div>
</div>

    card.classList.add("on"); fanfare(); burst(); sayQ(o.ask); }
  function hide(){ card.classList.remove("on"); }
  document.getElementById("revBtn").addEventListener("click",function(){ cAns.classList.add("show"); beep(760,0.16,"triangle",0.12); if(curO)sayA(curO.say); });
  document.getElementById("againBtn").addEventListener("click",function(){ hide(); setTimeout(spin,180); });
  card.addEventListener("click",function(e){ if(e.target===card) hide(); });
  addEventListener("keydown",function(e){ if((e.code==="Space"||e.code==="Enter") && !card.classList.contains("on")){ e.preventDefault(); spin(); } });
  var cc=document.getElementById("confetti"), cx=cc.getContext("2d"), parts=[];
  function size(){ [cc,document.getElementById("bg")].forEach(function(cv){ cv.width=innerWidth; cv.height=innerHeight; }); }
  size(); addEventListener("resize",size);
  var CC=["#FF6B6B","#4D96FF","#38C976","#FFB84D","#B15CFF","#FF7AC6","#F5C842"];
  function burst(){ if(reduce)return; for(var i=0;i<150;i++){ parts.push({x:innerWidth/2,y:innerHeight*0.42,vx:(Math.random()-0.5)*15,vy:Math.random()*-13-4,g:0.34,s:6+Math.random()*7,c:CC[(Math.random()*CC.length)|0],a:1,r:Math.random()*6,vr:(Math.random()-0.5)*0.4}); } }
  (function loop(){ cx.clearRect(0,0,cc.width,cc.height);
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.a-=0.008;
      if(p.a<=0||p.y>cc.height+20){ parts.splice(i,1); continue; }
      cx.save(); cx.globalAlpha=Math.max(p.a,0); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore(); }
    requestAnimationFrame(loop); })();
  var bg=document.getElementById("bg"), bx=bg.getContext("2d"), bub=[];
  for(var i=0;i<22;i++) bub.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:16+Math.random()*46,s:0.25+Math.random()*0.6,o:0.05+Math.random()*0.1,e:["⭐","✨","🫧","🎈"][(Math.random()*4)|0]});
  (function bgl(){ bx.clearRect(0,0,bg.width,bg.height); for(var i=0;i<bub.length;i++){ var b=bub[i]; b.y-=b.s; if(b.y<-60){b.y=bg.height+30;b.x=Math.random()*bg.width;} bx.save(); bx.globalAlpha=b.o; bx.font=b.r+"px serif"; bx.fillText(b.e,b.x,b.y); bx.restore(); } if(!reduce) requestAnimationFrame(bgl); })();
  draw();
})();
