<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крестики-нолики · Speak &amp; Smile</title>
<style>
  :root{ --p:#6C3FC5; --honey:#F5C842; --x:#3f86ff; --o:#ff5147; --ink:#2A2140;
    --f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--f); color:#fff; overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased;
    background:linear-gradient(160deg,#7C4DE0,#5B8DEF); }
  #app{ height:100%; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; gap:8px; padding:8px 12px; background:rgba(0,0,0,.18); flex-wrap:wrap; }
  .homebtn,.finbtn{ border:0; background:rgba(255,255,255,.22); color:#fff; font-size:14px; font-weight:800; border-radius:10px; padding:6px 11px; cursor:pointer; }
  .title{ font-weight:800; font-size:clamp(13px,2.1vh,19px); }
  .score{ margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:800; font-size:clamp(15px,2.3vh,20px);
    background:#fff; color:#2a2140; padding:4px 12px; border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.25); }
  .score .xs{ color:var(--x); } .score .os{ color:var(--o); } .score .sep{ opacity:.4; }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; gap:10px; }
  .turnline{ font-weight:800; font-size:clamp(15px,2.6vh,22px); text-shadow:0 2px 4px rgba(0,0,0,.3); }
  .turnline .who{ padding:2px 12px; border-radius:999px; }
  .board{ width:min(92vw,56vh); height:min(92vw,56vh); width:min(92vw,56dvh); height:min(92vw,56dvh); max-width:480px; max-height:480px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:min(2.4vw,10px); }
  .cell{ position:relative; border:0; cursor:pointer; background:rgba(255,255,255,.14); border-radius:18px;
    display:flex; align-items:center; justify-content:center; font-family:var(--f); font-weight:800;
    color:rgba(255,255,255,.6); font-size:clamp(26px,7vh,52px); box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); transition:background .15s; }
  .cell:not(.filled):active{ background:rgba(255,255,255,.26); }
  .cell.filled{ cursor:default; background:rgba(255,255,255,.2); }
  .cell.win{ background:#fff7d6; box-shadow:inset 0 0 0 3px var(--honey), 0 0 22px var(--honey); }
  .cell svg{ width:82%; height:82%; display:block; }
  .cell .num{ opacity:.65; }

  .mark{ width:100%; height:100%; transform-origin:center bottom; }
  .mark.arriving{ animation:hopIn .55s cubic-bezier(.2,1.35,.4,1) both; }
  @keyframes hopIn{ 0%{transform:translateY(-130%) scale(.55);opacity:0} 55%{transform:translateY(6%) scale(1.1);opacity:1} 72%{transform:translateY(-3%) scale(.96)} 100%{transform:translateY(0) scale(1)} }
  .mark .legs{ display:none; }
  .mark.arriving .legs{ display:block; }
  .mark.arriving .leg{ transform-origin:top center; animation:legwig .16s ease-in-out 5; }
  .mark.arriving .leg.r{ animation-delay:.08s; }
  @keyframes legwig{ 0%,100%{transform:rotate(-22deg)} 50%{transform:rotate(22deg)} }
  .eye{ animation:blink 3.2s infinite; }
  @keyframes blink{ 0%,94%,100%{transform:scaleY(1)} 97%{transform:scaleY(.15)} }

  .ov{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(24,12,48,.6); backdrop-filter:blur(3px); padding:14px; overflow-y:auto; }
  .ov.on{ display:flex; }
  .card{ background:#fff; color:var(--ink); border-radius:28px; padding:clamp(16px,3vh,30px) clamp(18px,4vw,40px); text-align:center; margin:auto;
    box-shadow:0 26px 70px rgba(0,0,0,.45); max-width:460px; width:100%; transform:scale(.85); transition:transform .3s cubic-bezier(.2,1.4,.4,1); }
  .ov.on .card{ transform:scale(1); }
  .claim{ font-weight:800; color:#5a2ea6; font-size:clamp(15px,2.3vh,19px); margin-bottom:6px; }
  .card .pic{ height:min(30vh,210px); width:auto; max-width:88%; filter:drop-shadow(0 10px 14px rgba(0,0,0,.18)); }
  .card .ask{ font-size:clamp(22px,4.6vh,40px); font-weight:800; color:var(--p); margin:.1em 0; }
  .card .ans{ font-size:clamp(20px,3.6vh,32px); font-weight:800; color:#b3760a; background:#fff7dd; padding:.1em .5em; border-radius:12px; display:inline-block; opacity:0; transition:opacity .2s; }
  .card .ans.show{ opacity:1; }
  .cbtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .cbtn{ border:0; cursor:pointer; font-family:var(--f); font-weight:800; font-size:clamp(15px,2.4vh,21px); padding:.5em 1.1em; border-radius:14px; transition:transform .07s; color:#fff; }
  .cbtn:active{ transform:translateY(3px); }
  .cbtn.say{ background:linear-gradient(180deg,#8A5FD8,#6C3FC5); box-shadow:0 5px 0 #4c2a90; }
  .cbtn.ok{ background:linear-gradient(180deg,#57c98b,#2ea866); box-shadow:0 5px 0 #1d7a48; }
  .cbtn.no{ background:linear-gradient(180deg,#f0836a,#e2542f); box-shadow:0 5px 0 #a83417; }
  .card .hint2{ font-size:13px; color:#8a83a0; margin-top:8px; }
  .setup h1,.win h1{ color:var(--p); font-size:clamp(22px,4vh,30px); margin:.15em 0; }
  .speaky{ height:96px; }
  .grp{ margin:10px 0; } .grp .lab{ font-weight:800; color:var(--p); margin-bottom:6px; }
  .opts{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .opt{ min-width:56px; padding:10px 16px; border-radius:14px; border:3px solid #e6ddf5; background:#faf8fe; color:var(--p); font-weight:800; font-size:18px; cursor:pointer; }
  .opt.sel{ border-color:var(--p); background:#efe7fb; }
  #confetti{ position:fixed; inset:0; z-index:16; pointer-events:none; }
  .toast{ position:fixed; left:50%; top:13%; transform:translateX(-50%); z-index:15; background:rgba(0,0,0,.82); color:#fff; font-weight:800; padding:12px 20px; border-radius:14px; font-size:clamp(16px,2.6vh,22px); opacity:0; transition:opacity .2s; pointer-events:none; text-align:center; }
  .toast.on{ opacity:1; }
</style>

<div id="app">
  <div class="topbar">
    <button class="homebtn" id="home">☰ Темы</button>
    <div class="title" id="gtitle">⭕ Крестики-нолики</div>
    <button class="finbtn" id="fin">🏁 Финиш</button>
    <div class="score" id="score"></div>
  </div>
  <div class="stage">
    <div class="turnline" id="turn"></div>
    <div class="board" id="board"></div>
  </div>
</div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<div class="ov" id="modal"><div class="card">
  <div class="claim" id="claim"></div>
  <img class="pic" id="mPic" alt="">
  <div class="ask" id="mAsk">What's this?</div>
  <div class="ans" id="mAns"></div>
  <div class="cbtns">
    <button class="cbtn say" id="sayBtn">🔊 Ответ</button>
    <button class="cbtn ok" id="okBtn">✅ Верно</button>
    <button class="cbtn no" id="noBtn">❌ Мимо</button>
  </div>
  <div class="hint2">Верно — значок встаёт на клетку. Ошибка — ход переходит.</div>
</div></div>

<div class="ov setup on" id="setup"><div class="card">
  <img class="speaky" id="spImg" alt="Speaky">
  <h1 id="setupTitle">Крестики-нолики!</h1>
  <div style="color:#6d6584;font-weight:600;font-size:14px">Выбери клетку → ответь на вопрос верно → твой значок прибежит на клетку! Собери 3 в ряд — победа раунда. <b style="color:var(--x)">✗ Крестики</b> против <b style="color:var(--o)">◯ Ноликов</b>.</div>
  <div class="grp"><div class="lab">Играем до скольких побед?</div><div class="opts" id="targetOpts"></div></div>
  <div class="cbtns"><button class="cbtn ok" id="startBtn">Играть! ▶</button></div>
  <div style="margin-top:10px"><a href="index.html" style="color:#8a83a0;font-weight:700;font-size:14px;text-decoration:none">← выбрать другую тему</a></div>
</div></div>

<div class="ov win" id="winov"><div class="card">
  <img class="speaky" id="winSp" alt="" style="height:130px">
  <h1 id="winTxt">🏆 Победа!</h1>
  <div id="winPts" style="font-weight:800;color:#b3760a;margin-top:4px"></div>
  <div class="cbtns"><button class="cbtn ok" id="againBtn">Ещё раз</button><button class="cbtn say" onclick="location.href='index.html'">☰ Темы</button></div>
</div></div>

    return '<svg viewBox="0 0 100 105">'+legs(c)+sh+eyeSVG()+'</svg>'; }

  // board
  const boardEl=$("#board"); let board=Array(9).fill(null), cur=0, busy=false, claimIdx=-1;
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function buildBoard(){ boardEl.innerHTML=""; board=Array(9).fill(null);
    for(let i=0;i<9;i++){ const b=document.createElement("button"); b.className="cell"; b.innerHTML='<span class="num">'+(i+1)+'</span>'; b.onclick=()=>pickCell(i); boardEl.appendChild(b); } }
  function cellEl(i){ return boardEl.children[i]; }
  function pickCell(i){ if(busy||board[i]) return; claimIdx=i; askQuestion(); }

  // question
  const modal=$("#modal"), mPic=$("#mPic"), mAsk=$("#mAsk"), mAns=$("#mAns"), claim=$("#claim");
  let curSay="";
  function askQuestion(){ busy=true; const q=nextQuestion();
    claim.innerHTML=`<span style="color:${COL[cur]}">${KIND[cur]==="X"?"✗":"◯"} ${NAMES[cur]}</span> — клетка ${claimIdx+1}`;
    if(q.pic){ mPic.src=q.pic; mPic.style.display=""; } else mPic.style.display="none";
    mAsk.textContent=q.ask; mAns.textContent=q.ans; curSay=q.say; mAns.classList.remove("show");
    modal.classList.add("on"); setTimeout(()=>speak(q.ask),350); }
  $("#sayBtn").onclick=()=>{ speak(curSay); mAns.classList.add("show"); };
  $("#okBtn").onclick=()=>{ modal.classList.remove("on"); place(claimIdx,cur); };
  $("#noBtn").onclick=()=>{ modal.classList.remove("on"); busy=false; toast("❌ Мимо! Ход переходит"); nextTurn(); };

  function place(i,who){ board[i]=KIND[who]; const el=cellEl(i); el.classList.add("filled");
    el.innerHTML='<span class="mark arriving">'+markSVG(KIND[who])+'</span>';
    setTimeout(()=>{ const m=el.querySelector(".mark"); if(m)m.classList.remove("arriving"); }, 640);
    const line=winLine(who); if(line){ setTimeout(()=>roundWin(who,line),650); return; }
    if(board.every(Boolean)){ setTimeout(()=>{ toast("🤝 Ничья!"); newRound(); },700); return; }
    busy=false; nextTurn(); }
  function winLine(who){ const k=KIND[who]; for(const L of LINES){ if(L.every(j=>board[j]===k)) return L; } return null; }
  function nextTurn(){ cur=1-cur; setTurn(); }

  // rounds / score
  let rscore=[0,0], TARGET=3, starter=0;
  function renderScore(){ $("#score").innerHTML=`<span class="xs">✗ ${rscore[0]}</span><span class="sep">:</span><span class="os">${rscore[1]} ◯</span>`; }
  function setTurn(){ $("#turn").innerHTML=`Ход: <span class="who" style="background:${COL[cur]}">${KIND[cur]==="X"?"✗":"◯"} ${NAMES[cur]}</span>`; }
  function roundWin(who,line){ busy=true; line.forEach(j=>cellEl(j).classList.add("win")); burst();
    rscore[who]++; renderScore(); toast(`🎉 ${NAMES[who]} — 3 в ряд!`);
    if(rscore[who]>=TARGET){ setTimeout(()=>gameOver(who),1400); return; }
    setTimeout(newRound,1700); }
  function newRound(){ starter=1-starter; cur=starter; buildBoard(); busy=false; setTurn(); }
  function startGame(){ rscore=[0,0]; starter=0; cur=0; renderScore(); buildBoard(); busy=false; setTurn(); }
  function gameOver(who){ burst(); $("#winTxt").textContent=`🏆 ${NAMES[who]} победили!`;
    $("#winPts").innerHTML=`Счёт раундов: <span style="color:var(--x)">✗ ${rscore[0]}</span> : <span style="color:var(--o)">${rscore[1]} ◯</span>`;
    if(ASSETS.speaky)$("#winSp").src=ASSETS.speaky; $("#winov").classList.add("on"); }

  // TTS / toast
  let voice=null;
  function pv(){ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }
  pv(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=pv;
  function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-GB"; if(voice)u.voice=voice; u.rate=.9; u.pitch=1.05; speechSynthesis.speak(u);}catch(e){} }
  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1500); }

  // buttons
  $("#home").onclick=()=>{ try{speechSynthesis.cancel();}catch(e){} location.href="index.html"; };
  $("#fin").onclick=()=>{ if(rscore[0]||rscore[1]){ const w=rscore[0]===rscore[1]?-1:(rscore[0]>rscore[1]?0:1); if(w<0){ toast("🤝 Пока ничья!"); } else gameOver(w); } };
  $("#againBtn").onclick=()=>{ $("#winov").classList.remove("on"); startGame(); };
  const targetOpts=$("#targetOpts");
  [2,3,5].forEach((v,i)=>{ const b=document.createElement("button"); b.className="opt"+(i===1?" sel":""); b.textContent=v; b.onclick=()=>{ TARGET=v; [...targetOpts.children].forEach(c=>c.classList.remove("sel")); b.classList.add("sel"); }; targetOpts.appendChild(b); });
  $("#startBtn").onclick=()=>{ $("#setup").classList.remove("on"); startGame(); speak(""); };

  // confetti
  const cc=$("#confetti"), cx=cc.getContext("2d"); let parts=[];
  function csize(){ cc.width=innerWidth; cc.height=innerHeight; } csize(); addEventListener("resize",csize);
  const CF=["#FF6B6B","#4D96FF","#38C976","#FFB84D","#B15CFF","#F5C842"];
  function burst(){ for(let i=0;i<140;i++) parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:Math.random()*-14-3,g:.35,s:6+Math.random()*7,c:CF[(Math.random()*CF.length)|0],a:1,r:Math.random()*6,vr:(Math.random()-.5)*.4}); }
  (function loop(){ cx.clearRect(0,0,cc.width,cc.height); for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.a-=.008;if(p.a<=0||p.y>cc.height+20){parts.splice(i,1);continue;}cx.save();cx.globalAlpha=Math.max(p.a,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();} requestAnimationFrame(loop); })();

  buildBoard(); setTurn(); renderScore();
})();
</script>
