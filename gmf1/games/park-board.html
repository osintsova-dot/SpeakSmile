<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ферма — бродилка · Speak &amp; Smile</title>
<style>
  :root{ --p:#6C3FC5; --p2:#8A5FD8; --honey:#F5C842; --ink:#2A2140;
    --f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{ font-family:var(--f); color:#fff; overflow:hidden;
    background:linear-gradient(160deg,#7C4DE0,#5B8DEF); -webkit-font-smoothing:antialiased; user-select:none; }
  #app{ height:100%; display:flex; flex-direction:column; }

  .topbar{ display:flex; align-items:center; gap:10px; padding:8px 12px; background:rgba(0,0,0,.14); }
  .topbar .title{ font-weight:800; font-size:clamp(15px,2.4vh,22px); }
  .topbar .title .q{ color:var(--honey); }
  .score{ margin-left:auto; display:flex; align-items:center; gap:9px; font-weight:800; font-size:clamp(12px,1.9vh,17px); }
  .score .s{ display:flex; align-items:center; gap:4px; }
  .score .s b{ width:13px;height:13px;border-radius:50%;display:inline-block;border:1.5px solid #fff; }
  .turn{ margin-left:14px; display:flex; align-items:center; gap:8px; font-weight:800; font-size:clamp(13px,2vh,18px); white-space:nowrap; }
  .turn .dot{ width:18px;height:18px;border-radius:50%;border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.3); }

  /* ---- board ---- */
  .boardwrap{ flex:1; position:relative; overflow:hidden; }
  #board{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .cell{ position:absolute; transform:translate(-50%,-50%); z-index:2;
    width:min(11vw,74px); height:min(11vw,74px); border-radius:50%;
    background:rgba(255,255,255,.92); border:3px solid var(--p);
    box-shadow:0 4px 10px rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; }
  .cell img{ width:80%; height:80%; object-fit:contain; }
  .cell .em{ font-size:min(6vw,34px); line-height:1; }
  .cell.start{ border-color:#2ea866; background:#daf5e6; }
  .cell.finish{ border-color:var(--honey); background:#fff4d1; width:min(15vw,100px); height:min(15vw,100px); }
  .cell.finish img{ width:92%; height:92%; }
  .cell.sp_fwd{ border-color:#2ea866; background:#e3f7ec; }
  .cell.sp_back{ border-color:#e2683f; background:#fde3d8; }
  .cell.sp_bonus{ border-color:var(--honey); background:#fff4d1; }
  .cell.sp_gem{ border-color:#4D96FF; background:#e2eeff; }
  .cell.sp_oops{ border-color:#e2683f; background:#fde3d8; }
  .cell.sp_again{ border-color:var(--p); background:#efe7fb; }
  .cell.grammar{ border-color:#4D96FF; background:#e2eeff; }
  .cell .lbl{ position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
    font-size:11px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); white-space:nowrap; }
  /* connecting path line */
  #pathsvg{ position:absolute; inset:0; z-index:1; width:100%; height:100%; pointer-events:none; }

  .token{ position:absolute; transform:translate(-50%,-70%); z-index:5;
    width:min(7vw,42px); height:min(7vw,42px); border-radius:50% 50% 50% 4px;
    border:3px solid #fff; box-shadow:0 4px 8px rgba(0,0,0,.4); transition:left .28s cubic-bezier(.3,1.3,.5,1), top .28s cubic-bezier(.3,1.3,.5,1);
    display:flex; align-items:center; justify-content:center; font-size:min(4vw,20px); font-weight:800; color:#fff; }

  /* ---- bottom controls ---- */
  .controls{ display:flex; align-items:center; gap:12px; padding:10px 14px; background:rgba(0,0,0,.16); }
  .rollbtn{ flex:1; border:0; cursor:pointer; font-family:var(--f); font-weight:800; font-size:clamp(18px,3vh,28px);
    color:#5a2ea6; padding:.55em 1em; border-radius:16px; background:linear-gradient(180deg,#FFE58A,#F5C842);
    box-shadow:0 7px 0 #c9950f, 0 12px 22px rgba(0,0,0,.3); transition:transform .07s,box-shadow .07s; }
  .rollbtn:active{ transform:translateY(5px); box-shadow:0 2px 0 #c9950f; }
  .rollbtn[disabled]{ filter:grayscale(.4) opacity(.7); }
  .dieface{ width:min(13vw,66px); height:min(13vw,66px); border-radius:14px; background:#fff; color:var(--p);
    display:flex; align-items:center; justify-content:center; font-size:min(9vw,44px); font-weight:800;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), 0 5px 12px rgba(0,0,0,.3); }
  .dieface.roll{ animation:shake .5s; }
  @keyframes shake{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-16deg) scale(1.05)} 75%{transform:rotate(16deg) scale(1.05)} }
  .iconbtn{ border:0; background:rgba(255,255,255,.2); color:#fff; font-size:20px; border-radius:12px; padding:10px 12px; cursor:pointer; }

  /* ---- modals ---- */
  .ov{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:rgba(30,16,60,.55); backdrop-filter:blur(3px); padding:16px; }
  .ov.on{ display:flex; }
  .card{ background:#fff; color:var(--ink); border-radius:28px; padding:clamp(16px,3vh,30px) clamp(18px,4vw,40px);
    text-align:center; box-shadow:0 26px 70px rgba(0,0,0,.45); max-width:440px; width:100%;
    transform:scale(.8); transition:transform .3s cubic-bezier(.2,1.4,.4,1); }
  .ov.on .card{ transform:scale(1); }
  .card .pic{ height:min(38vh,260px); width:auto; max-width:90%; filter:drop-shadow(0 10px 14px rgba(0,0,0,.18)); }
  .card .ask{ font-size:clamp(24px,5vh,44px); font-weight:800; color:var(--p); margin:.1em 0 .05em; }
  .card .ans{ font-size:clamp(22px,4vh,38px); font-weight:800; color:#b3760a; background:#fff7dd;
    padding:.1em .5em; border-radius:14px; display:inline-block; margin-top:.1em; opacity:0; transition:opacity .2s; }
  .card .ans.show{ opacity:1; }
  .cbtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .cbtn{ border:0; cursor:pointer; font-family:var(--f); font-weight:800; font-size:clamp(16px,2.6vh,22px);
    padding:.5em 1.1em; border-radius:14px; transition:transform .07s; }
  .cbtn:active{ transform:translateY(3px); }
  .cbtn.say{ color:#fff; background:linear-gradient(180deg,#57c98b,#2ea866); box-shadow:0 5px 0 #1d7a48; }
  .cbtn.next{ color:#fff; background:linear-gradient(180deg,#8A5FD8,#6C3FC5); box-shadow:0 5px 0 #4c2a90; }
  .card .hint{ font-size:14px; color:#8a83a0; margin-top:10px; }

  /* setup + win reuse .card */
  .setup .card, .win .card{ background:#fff; }
  .setup h1{ color:var(--p); font-size:clamp(22px,4vh,34px); margin:.2em 0; }
  .setup .speaky{ height:110px; }
  .pcount{ display:flex; gap:8px; justify-content:center; margin:14px 0; }
  .pc{ width:52px;height:52px;border-radius:14px;border:3px solid #e6ddf5; background:#faf8fe; color:var(--p);
    font-weight:800; font-size:22px; cursor:pointer; }
  .pc.sel{ border-color:var(--p); background:#efe7fb; }
  .toast{ position:fixed; left:50%; top:16%; transform:translateX(-50%); z-index:30; background:rgba(0,0,0,.8);
    color:#fff; font-weight:800; padding:12px 20px; border-radius:14px; font-size:clamp(16px,2.6vh,22px);
    opacity:0; transition:opacity .2s, top .2s; pointer-events:none; }
  .toast.on{ opacity:1; top:12%; }
  #confetti{ position:fixed; inset:0; z-index:25; pointer-events:none; }
</style>

<div id="app">
  <div class="topbar">
    <div class="title" id="gtitle">🎲</div>
    <div class="score" id="score"></div>
    <div class="turn" id="turn"></div>
  </div>
  <div class="boardwrap">
    <div id="board"></div>
    <svg id="pathsvg" preserveAspectRatio="none"><path id="pathline" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/></svg>
  </div>
  <div class="controls">
    <div class="dieface" id="die">🎲</div>
    <button class="rollbtn" id="roll">Кинуть кубик 🎲</button>
    <button class="iconbtn" id="reset" title="Заново">↺</button>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<!-- landing modal -->
<div class="ov" id="modal"><div class="card">
  <img class="pic" id="mPic" alt="">
  <div class="ask" id="mAsk">What's this?</div>
  <div class="ans" id="mAns"></div>
  <div class="cbtns">
    <button class="cbtn say" id="sayBtn">🔊 Скажи</button>
    <button class="cbtn next" id="nextBtn">Дальше →</button>
  </div>
  <div class="hint">Назови по-английски. Не помнишь — нажми 🔊</div>
</div></div>

<!-- setup -->
<div class="ov setup on" id="setup"><div class="card">
  <img class="speaky" id="spImg" alt="Speaky">
  <h1 id="setupTitle">Бродилка!</h1>
  <div style="color:#6d6584;font-weight:600">Кинь кубик, ходи, называй картинки по-английски. Кто первый дойдёт до домика Спики — победил! 🏠</div>
  <div style="margin-top:14px;font-weight:800;color:var(--p)">Сколько игроков?</div>
  <div class="pcount" id="pcount"></div>
  <div class="cbtns"><button class="cbtn next" id="startBtn">Играть! ▶</button></div>
</div></div>

<!-- win -->
<div class="ov win" id="winov"><div class="card">
  <img class="speaky" id="winSp" alt="" style="height:150px">
  <h1 style="color:var(--p)" id="winTxt">🏆 Победа!</h1>
  <div id="winPts" style="font-weight:800;color:#b3760a;margin-top:4px"></div>
  <div class="cbtns"><button class="cbtn next" id="againBtn">Ещё раз 🎲</button></div>
</div></div>

(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const board = $("#board"), TURN=$("#turn"), SCORE=$("#score");
  board.style.backgroundImage = `url(${ASSETS.bg})`;
  const items = ASSETS.items;
  const grammar = ASSETS.grammar || [];
  const imgByWord = {}; items.forEach(it=>imgByWord[it.word]=it.img);
  $("#gtitle").textContent=(ASSETS.emoji||"🎲")+" "+ASSETS.title;
  $("#setupTitle").textContent=ASSETS.title+" — бродилка!";
  document.title=ASSETS.title+" — бродилка · Speak & Smile";
  const COLORS = ["#FF6B6B","#4D96FF","#38C976","#B15CFF"];
  const NAMES = ["Красный","Синий","Зелёный","Фиолетовый"];

  // ---------- build path (boustrophedon) ----------
  const rowsY = [24,42,60,78], perRow = 5;
  const cells = [];  // {xPct,yPct,type,word}
  let idx=0;
  rowsY.forEach((y,ri)=>{
    for(let i=0;i<perRow;i++){
      let col = ri%2===0 ? i : (perRow-1-i);
      const x = 10 + col*(80/(perRow-1));
      cells.push({x, y, type:"animal"});
    }
  });
  const N = cells.length;
  cells[0].type="start";
  cells[N-1].type="finish";
  // specials
  const specialAt = {3:"sp_bonus", 6:"sp_fwd", 9:"sp_oops", 12:"sp_gem", 15:"sp_back", 18:"sp_again"};
  Object.entries(specialAt).forEach(([i,t])=>{ if(+i<N-1) cells[+i].type=t; });
  // grammar cells (💬) — questions on the unit's structure
  if(grammar.length){ let gi=0; [4,10,16].forEach(i=>{ if(i<N-1 && cells[i].type==="animal"){ cells[i].type="grammar"; cells[i].gitem=grammar[gi%grammar.length]; gi++; } }); }
  // assign animals to animal cells
  let ai=0;
  cells.forEach(c=>{ if(c.type==="animal"){ c.item = items[ai%items.length]; ai++; } });

  // ---------- render cells ----------
  function addLbl(el,t){ const l=document.createElement("div"); l.className="lbl"; l.textContent=t; el.appendChild(l); }
  function cellHTML(c,i){
    const el=document.createElement("div");
    el.className="cell "+(c.type==="animal"?"":c.type);
    el.style.left=c.x+"%"; el.style.top=c.y+"%";
    if(c.type==="animal"){ const im=new Image(); im.src=c.item.img; el.appendChild(im); }
    else if(c.type==="start"){ el.innerHTML='<div class="em">🚩</div>'; }
    else if(c.type==="finish"){ if(ASSETS.speaky){const im=new Image(); im.src=ASSETS.speaky; el.appendChild(im);} else el.innerHTML='<div class="em">🏠</div>'; const l=document.createElement("div"); l.className="lbl"; l.textContent="Дом Спики"; el.appendChild(l); }
    else if(c.type==="sp_fwd"){ el.innerHTML='<div class="em">➡️</div>'; addLbl(el,"+2 шага"); }
    else if(c.type==="sp_back"){ el.innerHTML='<div class="em">🕳️</div>'; addLbl(el,"−1 шаг"); }
    else if(c.type==="sp_bonus"){ el.innerHTML='<div class="em">⭐</div>'; addLbl(el,"+3 очка"); }
    else if(c.type==="sp_gem"){ el.innerHTML='<div class="em">💎</div>'; addLbl(el,"+5 очков"); }
    else if(c.type==="sp_oops"){ el.innerHTML='<div class="em">❌</div>'; addLbl(el,"−3 очка"); }
    else if(c.type==="sp_again"){ el.innerHTML='<div class="em">🔁</div>'; addLbl(el,"ещё раз"); }
    else if(c.type==="grammar"){ el.innerHTML='<div class="em">💬</div>'; addLbl(el,"вопрос"); }
    board.appendChild(el);
  }
  cells.forEach(cellHTML);
  // path line
  const pts = cells.map(c=>`${c.x},${c.y}`).join(" L ");
  $("#pathline").setAttribute("d","M "+pts);
  $("#pathsvg").setAttribute("viewBox","0 0 100 100");

  // ---------- players / tokens ----------
  let nPlayers=2, pos=[], points=[], tokens=[], cur=0, busy=false;
  function makeTokens(){
    tokens.forEach(t=>t.remove()); tokens=[]; pos=[]; points=[];
    for(let p=0;p<nPlayers;p++){
      pos.push(0); points.push(0);
      const t=document.createElement("div"); t.className="token"; t.style.background=COLORS[p];
      t.textContent=(p+1);
      board.appendChild(t); tokens.push(t);
    }
    placeAll();
    setTurn(); renderScore();
    busy=false; rollBtn.disabled=false; die.textContent="🎲";
    try{ speechSynthesis.cancel(); }catch(e){}
    modal.classList.remove("on");
  }
  function renderScore(){ SCORE.innerHTML=points.map((pt,p)=>`<span class="s"><b style="background:${COLORS[p]}"></b>${pt}</span>`).join(""); }
  function addPoints(p,n){ points[p]=Math.max(0,points[p]+n); renderScore(); }
  function cellXY(i){ return {x:cells[i].x, y:cells[i].y}; }
  function placeAll(){
    // offset tokens sharing a cell
    const byCell={};
    pos.forEach((c,p)=>{ (byCell[c]=byCell[c]||[]).push(p); });
    pos.forEach((c,p)=>{
      const grp=byCell[c]; const k=grp.indexOf(p); const off=(k-(grp.length-1)/2)*6;
      const xy=cellXY(c);
      tokens[p].style.left=(xy.x+off)+"%"; tokens[p].style.top=(xy.y)+"%";
    });
  }
  function setTurn(){
    TURN.innerHTML=`<span class="dot" style="background:${COLORS[cur]}"></span> Ход: игрок ${cur+1}`;
  }

  // ---------- dice + move ----------
  const die=$("#die"), rollBtn=$("#roll");
  const DFACE=["","⚀","⚁","⚂","⚃","⚄","⚅"];
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1400); }

  function roll(){
    if(busy) return; busy=true; rollBtn.disabled=true;
    die.classList.add("roll");
    let ticks=0; const spin=setInterval(()=>{ die.textContent=DFACE[1+Math.floor(Math.random()*3)]; if(++ticks>8){ clearInterval(spin); const n=1+Math.floor(Math.random()*3); die.textContent=DFACE[n]; die.classList.remove("roll"); step(n); } },70);
  }
  function step(n){
    let target=Math.min(pos[cur]+n, N-1);
    hop(pos[cur], target);
  }
  function hop(from,to){
    if(from<to){ pos[cur]=from+1; placeAll(); setTimeout(()=>hop(from+1,to),300); return; }
    landed();
  }
  function landed(){
    const i=pos[cur], c=cells[i];
    if(i===N-1){ win(cur); return; }
    if(c.type==="animal"){ showItem(c.item); return; }
    if(c.type==="grammar"){ showGrammar(c.gitem); return; }
    if(c.type==="sp_fwd"){ toast("➡️ +2 шага вперёд!"); setTimeout(()=>animateTo(Math.min(i+2,N-1),afterSpecial),700); return; }
    if(c.type==="sp_back"){ toast("🕳️ −1 шаг назад"); setTimeout(()=>animateTo(Math.max(i-1,0),afterSpecial),700); return; }
    if(c.type==="sp_bonus"){ addPoints(cur,3); toast("⭐ +3 очка!"); setTimeout(()=>endTurn(false),1000); return; }
    if(c.type==="sp_gem"){ addPoints(cur,5); toast("💎 +5 очков!"); burst(); setTimeout(()=>endTurn(false),1000); return; }
    if(c.type==="sp_oops"){ addPoints(cur,-3); toast("❌ −3 очка"); setTimeout(()=>endTurn(false),1000); return; }
    if(c.type==="sp_again"){ toast("🔁 Ходи ещё раз!"); setTimeout(()=>endTurn(true),1000); return; }
    endTurn(false);
  }
  function animateTo(to,cb){ function h(f){ if(f<to){pos[cur]=f+1;placeAll();setTimeout(()=>h(f+1),260);} else if(f>to){pos[cur]=f-1;placeAll();setTimeout(()=>h(f-1),260);} else cb(); } h(pos[cur]); }
  function afterSpecial(){ if(pos[cur]===N-1){ win(cur); return;} const c=cells[pos[cur]]; if(c.type==="animal"){ showItem(c.item);} else if(c.type==="grammar"){ showGrammar(c.gitem);} else endTurn(false); }

  // ---------- animal modal ----------
  const modal=$("#modal"), mPic=$("#mPic"), mAns=$("#mAns");
  const mAsk=$("#mAsk"); let curSay="";
  function showCard(ask, picSrc, ansText, sayText){ mAsk.textContent=ask; if(picSrc){ mPic.src=picSrc; mPic.style.display=""; } else { mPic.style.display="none"; } mAns.textContent=ansText; curSay=sayText; mAns.classList.remove("show"); modal.classList.add("on"); setTimeout(()=>speak(ask),350); }
  function showItem(item){ showCard("What's this?", item.img, item.say+"!", item.say); }
  function showGrammar(g){ showCard(g.q, imgByWord[g.word]||"", g.a, g.say||g.a); }
  $("#sayBtn").onclick=()=>{ speak(curSay); mAns.classList.add("show"); };
  $("#nextBtn").onclick=()=>{ modal.classList.remove("on"); addPoints(cur,1); endTurn(false); };

  // ---------- TTS ----------
  let voice=null;
  function pickVoice(){ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/en-US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
  pickVoice(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=pickVoice;
  function speak(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-GB"; if(voice)u.voice=voice; u.rate=.9; u.pitch=1.05; speechSynthesis.speak(u);}catch(e){} }

  // ---------- turns ----------
  function endTurn(again){ busy=false; rollBtn.disabled=false; if(!again){ cur=(cur+1)%nPlayers; } setTurn(); }

  // ---------- win ----------
  function win(p){ burst(); const w=$("#winov"); $("#winTxt").textContent=`🏆 Игрок ${p+1} дошёл первым!`;
    const rank=points.map((pt,i)=>({i,pt})).sort((a,b)=>b.pt-a.pt);
    $("#winPts").innerHTML="Очки: "+rank.map(r=>`игрок ${r.i+1} — ${r.pt}⭐`).join(" · ");
    if(ASSETS.speaky)$("#winSp").src=ASSETS.speaky; w.classList.add("on"); }

  rollBtn.onclick=roll;
  $("#reset").onclick=()=>{ cur=0; makeTokens(); };
  $("#againBtn").onclick=()=>{ $("#winov").classList.remove("on"); cur=0; makeTokens(); };

  // ---------- setup screen ----------
  if(ASSETS.speaky) $("#spImg").src=ASSETS.speaky;
  const pcw=$("#pcount");
  [1,2,3,4].forEach(k=>{ const b=document.createElement("button"); b.className="pc"+(k===2?" sel":""); b.textContent=k; b.onclick=()=>{ nPlayers=k; [...pcw.children].forEach(c=>c.classList.remove("sel")); b.classList.add("sel"); }; pcw.appendChild(b); });
  $("#startBtn").onclick=()=>{ $("#setup").classList.remove("on"); makeTokens(); speak(""); /* unlock TTS on gesture */ };

  // ---------- confetti ----------
  const cc=$("#confetti"), cx=cc.getContext("2d"); let parts=[];
  function size(){ cc.width=innerWidth; cc.height=innerHeight; } size(); addEventListener("resize",()=>{size();placeAll();});
  const CF=["#FF6B6B","#4D96FF","#38C976","#FFB84D","#B15CFF","#F5C842"];
  function burst(){ for(let i=0;i<180;i++) parts.push({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*16,vy:Math.random()*-15-4,g:.35,s:6+Math.random()*8,c:CF[(Math.random()*CF.length)|0],a:1,r:Math.random()*6,vr:(Math.random()-.5)*.4}); }
  (function loop(){ cx.clearRect(0,0,cc.width,cc.height); for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.a-=.008;if(p.a<=0||p.y>cc.height+20){parts.splice(i,1);continue;}cx.save();cx.globalAlpha=Math.max(p.a,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();} requestAnimationFrame(loop); })();
})();
</script>
