<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mimi's Wheel 3 · Speak&Smile</title>
<style>
:root{
  --p:#6C3FC5; --honey:#F5C842; --violet:#8B5CF6; --sky:#63B3FF; --pink:#F17FBE; --teal:#34D3C0;
  --ink:#2A2140; --muted:#6A5B9A;
  --f:"Baloo 2","Segoe UI Rounded",ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--f); color:#fff; min-height:100%; overflow-x:hidden;
  background:
    radial-gradient(120% 90% at 15% 0%, rgba(241,127,190,.35), transparent 55%),
    radial-gradient(120% 90% at 100% 10%, rgba(99,179,255,.40), transparent 55%),
    radial-gradient(140% 120% at 50% 100%, #5B34C9, transparent 60%),
    linear-gradient(180deg,#7C4DE0 0%, #5B3FCF 55%, #4A2FB0 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 20px; text-align:center; position:relative;
}
/* мягкое сияние-колесо за героем */
body::before{
  content:""; position:fixed; z-index:0; top:-18vmin; left:50%; width:120vmin; height:120vmin;
  transform:translateX(-50%);
  background:
    conic-gradient(from 0deg, rgba(255,255,255,.10) 0 30deg, transparent 30deg 60deg,
      rgba(255,255,255,.10) 60deg 90deg, transparent 90deg 120deg,
      rgba(255,255,255,.10) 120deg 150deg, transparent 150deg 180deg,
      rgba(255,255,255,.10) 180deg 210deg, transparent 210deg 240deg,
      rgba(255,255,255,.10) 240deg 270deg, transparent 270deg 300deg,
      rgba(255,255,255,.10) 300deg 330deg, transparent 330deg 360deg);
  border-radius:50%; filter:blur(2px); opacity:.5;
  animation:spin 60s linear infinite;
  -webkit-mask:radial-gradient(closest-side, transparent 38%, #000 42%, #000 70%, transparent 74%);
          mask:radial-gradient(closest-side, transparent 38%, #000 42%, #000 70%, transparent 74%);
}
/* плавающие пузырьки */
.bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-14vh;border-radius:50%;opacity:.5;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 60%, transparent 70%);
  animation:rise linear infinite}
.bubbles i:nth-child(1){left:8%;width:46px;height:46px;animation-duration:17s;animation-delay:-2s}
.bubbles i:nth-child(2){left:24%;width:26px;height:26px;animation-duration:21s;animation-delay:-8s}
.bubbles i:nth-child(3){left:47%;width:60px;height:60px;animation-duration:26s;animation-delay:-4s;opacity:.35}
.bubbles i:nth-child(4){left:68%;width:32px;height:32px;animation-duration:19s;animation-delay:-11s}
.bubbles i:nth-child(5){left:83%;width:52px;height:52px;animation-duration:23s;animation-delay:-6s;opacity:.4}
.bubbles i:nth-child(6){left:92%;width:22px;height:22px;animation-duration:16s;animation-delay:-14s}

.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px}

/* герой */
.hero{display:flex;flex-direction:column;align-items:center;animation:pop .7s cubic-bezier(.2,.9,.25,1.1) both}
.logo-wrap{position:relative;display:grid;place-items:center;margin-bottom:6px}
.logo-wrap::after{content:"";position:absolute;inset:-14px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.55), transparent 72%);filter:blur(6px);z-index:-1}
.logo{height:118px;width:auto;filter:drop-shadow(0 10px 20px rgba(30,10,70,.35));animation:bob 4.5s ease-in-out infinite}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:.2px;margin:8px 0 0;
  text-shadow:0 3px 0 rgba(74,32,150,.25),0 8px 22px rgba(0,0,0,.25)}
h1 .w{color:var(--honey)}
.sub{display:inline-block;margin:12px 0 30px;padding:8px 18px;border-radius:999px;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.28);font-weight:700;font-size:clamp(13px,3.4vw,16px)}

/* плитки */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;width:100%}
@media(max-width:520px){.tiles{grid-template-columns:1fr;max-width:340px;margin:0 auto}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:#fff;color:var(--ink);border-radius:28px;padding:30px 18px 26px;text-decoration:none;
  box-shadow:0 14px 30px rgba(30,10,70,.30),0 3px 0 rgba(0,0,0,.04);overflow:hidden;
  transform:translateY(18px);opacity:0;animation:rise-in .6s cubic-bezier(.2,.9,.25,1.1) forwards;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.tile:nth-child(1){animation-delay:.18s}
.tile:nth-child(2){animation-delay:.30s}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:var(--band)}
.tile:hover{transform:translateY(-6px);box-shadow:0 22px 42px rgba(30,10,70,.38)}
.tile:active{transform:translateY(-1px) scale(.985);transition-duration:.06s}
.ic{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;font-size:44px;line-height:1;
  background:var(--icbg);box-shadow:inset 0 -4px 10px rgba(0,0,0,.06),0 8px 18px var(--icsh);
  transition:transform .18s}
.tile:hover .ic{transform:scale(1.06) rotate(-3deg)}
.t{font-size:22px;font-weight:800}
.d{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.35;max-width:170px}
.go{margin-top:2px;font-size:13px;font-weight:800;color:var(--p);display:inline-flex;align-items:center;gap:5px}
.go .arw{transition:transform .18s}
.tile:hover .go .arw{transform:translateX(4px)}

.tile.games{--band:linear-gradient(90deg,var(--violet),var(--sky))}
.tile.games .ic{--icbg:linear-gradient(160deg,#EEE6FF,#DCCBFF);--icsh:rgba(139,92,246,.25)}
.tile.games .go{color:var(--violet)}
.tile.phon{--band:linear-gradient(90deg,var(--honey),#FF9E57)}
.tile.phon .ic{--icbg:linear-gradient(160deg,#FFF7DA,#FFE9AE);--icsh:rgba(245,200,66,.35)}
.tile.phon .go{color:#C98A00}

.foot{position:relative;z-index:1;margin-top:34px;opacity:.85;font-size:12px;font-weight:700;letter-spacing:.2px}
.foot b{color:var(--honey)}

@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
@keyframes rise{0%{transform:translateY(0)}100%{transform:translateY(-120vh)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes rise-in{to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .tile{opacity:1;transform:none}
}
</style></head><body>

<div class="bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div class="wrap">
  <div class="hero">
    <div class="logo-wrap"><img class="logo" src="../assets/speaky.png" alt="Speaky"></div>
    <h1>Mimi's <span class="w">Wheel</span> 3</h1>
    <span class="sub">🎡 Игры и фониксы для дошкольников</span>
  </div>

  <div class="tiles">
    <a class="tile games" href="games/">
      <span class="ic">🎲</span>
      <span class="t">Игры</span>
      <span class="d">на проектор · по юнитам</span>
      <span class="go">Открыть <span class="arw">→</span></span>
    </a>
    <a class="tile phon" href="../gmf1/phonics/?from=mimi">
      <span class="ic">🔤</span>
      <span class="t">Фониксы</span>
      <span class="d">Phonics Hub · чтение по тетради</span>
      <span class="go">Открыть <span class="arw">→</span></span>
    </a>
  </div>
</div>

<div class="foot">Speak <b>&amp;</b> Smile · speakandsmile.ru</div>
</body></html>
