<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Big Wheel · Where's it? · Mimi's Wheel 3</title>
<style>
:root{--p:#6C3FC5;--honey:#F5C842;--f:"Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif;
 --c1:#E8402E;--c2:#2E9BE8;--c3:#F5922E;--c4:#F5C842;--c5:#E85AA0;--c6:#4CAF50;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--f);background:radial-gradient(120% 120% at 50% 0%,#8FD0FF 0%,#5B8DEF 45%,#7C4DE0 100%);
 color:#fff;min-height:100%;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.bar .logo{height:34px;width:auto}.bar b{font-size:clamp(15px,2.1vw,21px)}.bar .sp{flex:1}
.bar a{font-family:inherit;font-weight:800;border-radius:12px;padding:8px 14px;font-size:15px;
 background:rgba(255,255,255,.2);color:#fff;text-decoration:none}
.stage{flex:1;display:grid;grid-template-columns:1fr minmax(320px,42vh);gap:2vw;align-items:center;padding:0 4vw 3vh;min-height:0}
@media(max-width:820px){.stage{grid-template-columns:1fr;gap:1vh;padding:0 3vw 2vh}}
.ask{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;text-align:center}
.qlabel{font-size:clamp(19px,2.8vw,28px);font-weight:800;opacity:.95;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.qbox{width:min(30vh,34vw);height:min(30vh,34vw);border-radius:28px;display:flex;align-items:center;justify-content:center;
 background:#fff;color:var(--p);font-size:min(20vh,22vw);font-weight:800;line-height:1;overflow:hidden;
 box-shadow:0 12px 40px rgba(0,0,0,.28);border:8px solid var(--honey)}
.qbox img{width:100%;height:100%;object-fit:contain;padding:6%}
.qword{font-size:clamp(20px,3vw,30px);font-weight:800;text-transform:capitalize;min-height:1.1em}
.qrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font-family:inherit;font-weight:800;border:none;border-radius:16px;padding:14px 22px;font-size:clamp(15px,1.8vw,19px);
 cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.btn.say{background:var(--honey);color:#4A2E85}.btn.next{background:#fff;color:var(--p)}
.score{font-size:clamp(18px,2.4vw,26px);font-weight:800;letter-spacing:2px;min-height:1.2em}
.wheelwrap{position:relative;width:100%;aspect-ratio:1/1;max-height:82vh;margin:auto}
.wheel{position:absolute;inset:0}
.ring{position:absolute;inset:6%;border-radius:50%;border:min(2.4vh,18px) solid rgba(255,255,255,.55)}
.spoke{position:absolute;left:50%;top:50%;width:44%;height:min(1.2vh,9px);background:rgba(255,255,255,.5);
 transform-origin:0 50%;border-radius:6px}
.hub{position:absolute;left:50%;top:50%;width:9%;height:9%;background:var(--p);border:4px solid #fff;
 border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.pod{position:absolute;width:25%;height:25%;transform:translate(-50%,-50%);cursor:pointer;transition:transform .12s}
.pod .cab{width:100%;height:100%;border-radius:24% 24% 30% 30%/28% 28% 40% 40%;display:flex;align-items:center;justify-content:center;
 color:#fff;font-weight:800;font-size:min(9vh,9vw);box-shadow:0 8px 18px rgba(0,0,0,.28);
 border:5px solid rgba(255,255,255,.9);position:relative;overflow:hidden}
.pod .cab img{width:86%;height:86%;object-fit:contain}
.pod .cab::before{content:"";position:absolute;top:-12%;left:50%;width:6%;height:14%;background:rgba(255,255,255,.7);transform:translateX(-50%)}
.pod:active{transform:translate(-50%,-50%) scale(.94)}
.pod.correct .cab{animation:pop .5s ease}
.pod.wrong .cab{animation:shake .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pod.correct .cab::after{content:"✓";position:absolute;right:-4%;top:-4%;width:38%;height:38%;background:#31C06A;color:#fff;
 border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(4.5vh,4.5vw);border:4px solid #fff}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.c4{background:var(--c4)}.c5{background:var(--c5)}.c6{background:var(--c6)}
.toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);background:#fff;color:var(--p);font-weight:800;
 font-size:clamp(18px,2.6vw,26px);padding:14px 26px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.3);
 opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style>
</head>
<body>
<div class="bar">
  <img class="logo" src="../../assets/speaky.png" alt="Speaky">
  <b id="title">Big Wheel</b><span class="sp"></span>
  <a href="index.html">← Игры</a>
</div>
<div class="stage">
  <div class="ask">
    <div class="qlabel" id="qlabel">Where's…</div>
    <div class="qbox" id="qbox">?</div>
    <div class="qword" id="qword"></div>
    <div class="score" id="score"></div>
    <div class="qrow">
      <button class="btn say" id="say">🔊 Say it</button>
      <button class="btn next" id="next">Дальше →</button>
    </div>
  </div>
  <div class="wheelwrap"><div class="wheel">
    <div class="ring"></div><div class="spokes" id="spokes"></div><div class="hub"></div>
  </div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var DATA={"title": "Unit 1 · Hello", "mode": "num", "pods": [{"colour": "red", "cls": "c1", "label": "1"}, {"colour": "blue", "cls": "c2", "label": "2"}, {"colour": "orange", "cls": "c3", "label": "3"}, {"colour": "yellow", "cls": "c4", "label": "4"}, {"colour": "pink", "cls": "c5", "label": "5"}, {"colour": "green", "cls": "c6", "label": "6"}]};
document.getElementById("title").textContent="Big Wheel · "+DATA.title;
document.getElementById("qlabel").textContent = DATA.mode==="num" ? "Where's number…" : "Where's the…";
var wheel=document.querySelector(".wheel"), spokes=document.getElementById("spokes");
var qbox=document.getElementById("qbox"), qword=document.getElementById("qword"), scoreEl=document.getElementById("score"), toast=document.getElementById("toast");
var target=null,stars=0,locked=false;
DATA.pods.forEach(function(p,i){
  var ang=-90+i*60, rad=ang*Math.PI/180, R=37;
  var x=50+R*Math.cos(rad), y=50+R*Math.sin(rad);
  var pod=document.createElement("div"); pod.className="pod"; pod.style.left=x+"%"; pod.style.top=y+"%";
  var inner = p.img ? '<img src="'+p.img+'" alt="">' : (p.label||"");
  pod.innerHTML='<div class="cab '+p.cls+'">'+inner+'</div>';
  pod.addEventListener("click",function(){choose(p,pod)});
  wheel.appendChild(pod);
  var sp=document.createElement("div"); sp.className="spoke"; sp.style.transform="rotate("+ang+"deg)"; spokes.appendChild(sp);
});
function speak(t){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;u.pitch=1.05;
 var vs=window.speechSynthesis.getVoices();var v=vs.find(function(x){return/en-GB/i.test(x.lang)})||vs.find(function(x){return/^en/i.test(x.lang)});if(v)u.voice=v;window.speechSynthesis.speak(u)}catch(e){}}
function showToast(t){toast.textContent=t;toast.classList.add("show");clearTimeout(showToast._t);showToast._t=setTimeout(function(){toast.classList.remove("show")},1600)}
function rnd(){rnd._s=(rnd._s*9301+49297)%233280;return rnd._s/233280} rnd._s=Math.floor((performance.now()*13)%233280)+1;
function ask(t){ return DATA.mode==="num" ? "Where's number "+t.label+"?" : "Where's the "+t.label+"?"; }
function newQ(){
  locked=false; document.querySelectorAll(".pod").forEach(function(p){p.classList.remove("correct","wrong")});
  target=DATA.pods[Math.floor(rnd()*DATA.pods.length)];
  if(DATA.mode==="num"){ qbox.textContent=target.label; qword.textContent=""; }
  else { qbox.innerHTML='<img src="'+target.img+'" alt="">'; qword.textContent=target.label; }
  setTimeout(function(){speak(ask(target))},250);
}
function choose(p,pod){
  if(locked)return;
  if(p.colour===target.colour){
    locked=true; pod.classList.add("correct"); stars++; scoreEl.textContent="⭐".repeat(Math.min(stars,10));
    var phr = DATA.mode==="num" ? ("Number "+target.label+" is on "+p.colour+"!") : ("The "+target.label+" is on "+p.colour+"!");
    speak(phr); showToast("It's on "+p.colour+"! ⭐");
    setTimeout(newQ,1800);
  } else { pod.classList.add("wrong"); speak("Try again!"); setTimeout(function(){pod.classList.remove("wrong")},450); }
}
document.getElementById("say").addEventListener("click",function(){if(target)speak(ask(target))});
document.getElementById("next").addEventListener("click",newQ);
if("speechSynthesis" in window){window.speechSynthesis.getVoices();}
newQ();
</script>
</body>
</html>
